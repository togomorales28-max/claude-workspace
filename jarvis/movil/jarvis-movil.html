<title>Jarvis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: una sola pantalla. Núcleo holográfico al fondo, consola de mando abajo. Tema oscuro único a propósito. */
  :root {
    --bg: #03060d;
    --bg-2: #0a1424;
    --panel: rgba(4, 9, 18, 0.82);
    --gold: #ffb52e;
    --gold-hi: #ffe39a;
    --gold-dim: rgba(255, 181, 46, 0.35);
    --text: #f4e6c4;
    --muted: #8ea2bd;
    --warn: #ff8a65;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  html { height: 100%; box-sizing: border-box; }
  body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    background: radial-gradient(120% 80% at 50% 38%, var(--bg-2) 0%, var(--bg) 70%);
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
  }
  #orb { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: manipulation; }

  .app {
    position: relative; z-index: 1; height: 100%; max-height: 100dvh; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: space-between;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px calc(36px + env(safe-area-inset-bottom, 0px));
    pointer-events: none;
  }
  .app > * { pointer-events: auto; }

  header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--mono); }
  .brand { letter-spacing: .45em; color: var(--gold); font-size: 13px; text-shadow: 0 0 12px var(--gold-dim); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 10px; letter-spacing: .12em; padding: 4px 7px; border-radius: 2px;
    border: 1px solid var(--gold-dim); color: var(--muted); background: var(--panel);
  }
  .chip.ok { color: var(--gold-hi); border-color: var(--gold); }
  .chip.warn { color: var(--warn); border-color: rgba(255, 138, 101, .5); }
  button.chip { font-family: var(--mono); cursor: pointer; }

  .console {
    display: flex; flex-direction: column; gap: 10px;
    width: 100%; max-width: 680px; margin-inline: auto;
  }
  .status {
    font-family: var(--mono); font-size: 11px; letter-spacing: .4em; color: var(--gold);
    text-align: center; text-shadow: 0 0 10px var(--gold-dim);
  }
  .log {
    max-height: 32vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    padding: 10px 12px; background: var(--panel); border: 1px solid var(--gold-dim); border-radius: 2px;
    -webkit-overflow-scrolling: touch;
  }
  .msg { margin: 0; line-height: 1.45; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.you { color: var(--muted); font-size: 14px; }
  .msg.you::before { content: "TÚ  "; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--gold-dim); }
  .msg.jarvis::before { content: "JARVIS  "; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--gold); }
  .msg.err { color: var(--warn); }
  .msg.hint { color: var(--muted); font-size: 13px; }

  form { display: flex; gap: 8px; }
  #text {
    flex: 1; min-width: 0; font: 16px var(--sans); color: var(--text);
    background: var(--panel); border: 1px solid var(--gold-dim); border-radius: 2px;
    padding: 12px; outline: none;
  }
  #text:focus { border-color: var(--gold); }
  .btn {
    flex: none; width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid var(--gold); background: var(--panel); color: var(--gold-hi);
    display: grid; place-items: center; cursor: pointer;
  }
  .btn svg { width: 22px; height: 22px; }
  .btn.live { background: var(--gold); color: var(--bg); box-shadow: 0 0 18px var(--gold-dim); }
  .btn:focus-visible, #text:focus-visible, button.chip:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
</style>

<canvas id="orb" aria-hidden="true"></canvas>

<div class="app">
  <header>
    <div class="brand">J.A.R.V.I.S.</div>
    <div class="chips">
      <span class="chip" id="chip-brain">CEREBRO · …</span>
      <span class="chip" id="chip-mic">MIC · …</span>
      <button class="chip" id="chip-voice" type="button" aria-pressed="true">VOZ · …</button>
      <button class="chip ok" id="test-voice" type="button">PROBAR VOZ</button>
    </div>
  </header>

  <section class="console">
    <div class="status" id="status" role="status">EN ESPERA</div>
    <div class="log" id="log" aria-live="polite">
      <p class="msg hint" id="hint">Toca el micrófono y háblame, o escribe abajo. Ejemplo: «Dame tres ideas para cenar rápido».</p>
    </div>
    <form id="form" autocomplete="off">
      <input id="text" type="text" placeholder="Escríbele a Jarvis…" aria-label="Mensaje para Jarvis" enterkeyhint="send">
      <button class="btn" id="mic" type="button" aria-label="Hablar" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="btn" id="send" type="submit" aria-label="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </section>
</div>

<script>
'use strict';
/* ---------------- 1. Núcleo holográfico ---------------- */
const canvas = document.getElementById('orb');
const ctx = canvas.getContext('2d');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, R = 150;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  R = Math.min(W * 0.36, H * 0.24);
}
window.addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const small = Math.min(window.innerWidth, window.innerHeight) < 600;
const shards = Array.from({ length: small ? 1100 : 1700 }, () => {
  const u = Math.random() * 2 - 1, th = Math.random() * TAU, s = Math.sqrt(1 - u * u);
  return { x: s * Math.cos(th), y: u, z: s * Math.sin(th), r: rand(0.82, 1.04), len: rand(0.015, 0.11), w: rand(0.7, 2.4), tw: Math.random() * TAU, sp: rand(0.5, 3) };
});
const rings = Array.from({ length: 6 }, (_, i) => ({
  tiltX: rand(-1.2, 1.2), tiltZ: rand(-1, 1), r: rand(0.55, 1.08), speed: rand(-0.5, 0.5) || 0.2,
  dash: Math.floor(rand(18, 60)), fill: rand(0.35, 0.85), phase: Math.random() * TAU, width: i < 2 ? 2 : rand(0.8, 1.5),
}));
const ticks = Array.from({ length: 140 }, (_, i) => ({ a: (i / 140) * TAU, l: Math.random() < 0.15 ? rand(8, 26) : rand(2, 8), on: Math.random() < 0.8 }));
const orb = { mode: 'idle', level: 0, energy: 0.25 };

function rotate(p, ay, ax) {
  const cy = Math.cos(ay), sy = Math.sin(ay), cx = Math.cos(ax), sx = Math.sin(ax);
  const x = p.x * cy + p.z * sy; let z = -p.x * sy + p.z * cy;
  const y = p.y * cx - z * sx; z = p.y * sx + z * cx;
  return { x, y, z };
}
const gold = (a, l = 60) => `hsla(${30 + l / 8}, 100%, ${l}%, ${Math.min(1, a)})`;

let t0 = performance.now(), spin = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - t0) / 1000); t0 = now;
  const target = { idle: 0.25, listening: 0.55, thinking: 0.9, speaking: 0.6 }[orb.mode];
  orb.energy += (target - orb.energy) * dt * 2;
  if (orb.mode === 'speaking') orb.level += ((0.25 + Math.random() * 0.6) - orb.level) * 0.3; else orb.level *= 0.9;
  const pulse = orb.mode === 'speaking' ? orb.level : orb.mode === 'listening' ? 0.15 + 0.1 * Math.sin(now / 180) : 0;
  spin += dt * (reduceMotion ? 0.05 : 0.15 + orb.energy * 0.6);

  const cx = W / 2, cy = H * 0.36, rad = R * (1 + pulse * 0.08);
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad * 1.5);
  g.addColorStop(0, gold(0.32 + pulse * 0.3, 58)); g.addColorStop(0.45, gold(0.12 + orb.energy * 0.08, 45)); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const tiltX = 0.35 + Math.sin(now / 5000) * 0.1;

  for (const s of shards) {
    const p1 = rotate(s, spin, tiltX), p2 = rotate(s, spin + s.len, tiltX);
    const depth = (p1.z + 1) / 2, flick = 0.55 + 0.45 * Math.sin(now / 1000 * s.sp + s.tw);
    const k = rad * s.r * (1 + pulse * 0.1 * Math.sin(s.tw));
    ctx.strokeStyle = gold((0.3 + depth * 0.9) * flick * (0.8 + orb.energy * 0.6), 55 + depth * 25);
    ctx.lineWidth = s.w * (0.6 + depth * 0.8);
    ctx.beginPath(); ctx.moveTo(cx + p1.x * k, cy + p1.y * k); ctx.lineTo(cx + p2.x * k, cy + p2.y * k); ctx.stroke();
  }
  for (const r of rings) {
    const seg = TAU / r.dash, rot = r.phase + now / 1000 * r.speed * (0.6 + orb.energy);
    const cz = Math.cos(r.tiltZ), sz = Math.sin(r.tiltZ);
    for (let i = 0; i < r.dash; i++) {
      const a0 = i * seg + rot, a1 = a0 + seg * r.fill;
      ctx.beginPath();
      for (let k = 0; k <= 4; k++) {
        const a = a0 + (a1 - a0) * (k / 4);
        let p = rotate({ x: Math.cos(a), y: 0, z: Math.sin(a) }, 0, r.tiltX);
        p = rotate({ x: p.x * cz - p.y * sz, y: p.x * sz + p.y * cz, z: p.z }, spin * 0.4, tiltX);
        const x = cx + p.x * rad * r.r, y = cy + p.y * rad * r.r;
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        if (k === 2) ctx.strokeStyle = gold(0.35 + (p.z + 1) * 0.35, 64);
      }
      ctx.lineWidth = r.width; ctx.stroke();
    }
  }
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-spin * 0.5);
  ctx.strokeStyle = gold(0.6, 62); ctx.lineWidth = 1.3;
  for (const tk of ticks) {
    if (!tk.on) continue;
    const r0 = rad * 1.1, r1 = r0 + tk.l * (1 + pulse);
    ctx.beginPath(); ctx.moveTo(Math.cos(tk.a) * r0, Math.sin(tk.a) * r0); ctx.lineTo(Math.cos(tk.a) * r1, Math.sin(tk.a) * r1); ctx.stroke();
  }
  ctx.strokeStyle = gold(0.45, 62); ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.arc(0, 0, rad * 1.08, 0.2, TAU * 0.62); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, rad * 1.24, TAU * 0.7, TAU * 0.95); ctx.stroke();
  ctx.restore();

  ctx.save(); ctx.translate(cx, cy); ctx.rotate(spin * 1.3);
  ctx.lineWidth = 3 + pulse * 3; ctx.strokeStyle = gold(0.85, 72);
  ctx.beginPath();
  for (let a = 0; a < TAU * 1.15; a += 0.05) {
    const rr = rad * (0.08 + a / (TAU * 1.15) * 0.62), x = Math.cos(a) * rr, y = Math.sin(a) * rr * 0.82;
    a ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.rotate(-spin * 2.6);
  for (let i = 0; i < 3; i++) {
    ctx.lineWidth = 1.4; ctx.strokeStyle = gold(0.5 + pulse * 0.4, 78);
    ctx.beginPath(); ctx.arc(0, 0, rad * (0.07 + i * 0.035) * (1 + pulse * 0.4), i, i + TAU * 0.75); ctx.stroke();
  }
  const core = ctx.createRadialGradient(0, 0, 0, 0, 0, rad * 0.14);
  core.addColorStop(0, gold(0.9, 92)); core.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(0, 0, rad * 0.14 * (1 + pulse * 0.6), 0, TAU); ctx.fill();
  ctx.restore();

  for (let i = 0; i < 60 + orb.energy * 90; i++) {
    const a = Math.random() * TAU, rr = rad * rand(0.3, 1.25);
    ctx.fillStyle = gold(0.3 + Math.random() * 0.7, 82);
    ctx.fillRect(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, rand(1, 2.2), rand(1, 2.2));
  }
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- 2. Interfaz ---------------- */
const $ = (id) => document.getElementById(id);
const ui = { status: $('status'), log: $('log'), form: $('form'), text: $('text'), mic: $('mic'), send: $('send'),
  chipBrain: $('chip-brain'), chipMic: $('chip-mic'), chipVoice: $('chip-voice'), hint: $('hint') };
const LABELS = { idle: 'EN ESPERA', listening: 'ESCUCHANDO', thinking: 'PROCESANDO', speaking: 'HABLANDO' };
function setMode(m) { orb.mode = m; ui.status.textContent = LABELS[m]; }
function chip(el, label, ok) { el.textContent = label; el.className = 'chip ' + (ok ? 'ok' : 'warn'); }
function addMsg(kind, text) {
  const p = document.createElement('p'); p.className = 'msg ' + kind; p.textContent = text;
  ui.log.appendChild(p); ui.log.scrollTop = ui.log.scrollHeight; return p;
}

const SYSTEM = [
  'Eres Jarvis, el asistente personal de voz del usuario. Responde siempre en español,',
  'breve y natural (1 a 4 frases), como si hablaras en voz alta: sin markdown, sin listas con viñetas,',
  'sin emojis ni URLs largas, salvo que te lo pidan. Trata al usuario con cercanía y un toque de humor elegante.',
  'Desde el celular no tienes acceso al correo, al calendario ni al computador del usuario: si te lo piden, dilo con sencillez.',
].join(' ');

let history = [];
try { history = JSON.parse(localStorage.getItem('jarvis-historial') || '[]').slice(-16); } catch { history = []; }
for (const m of history) addMsg(m.role === 'user' ? 'you' : 'jarvis', m.content);
if (history.length) ui.hint.hidden = true;
function saveHistory() { try { localStorage.setItem('jarvis-historial', JSON.stringify(history.slice(-16))); } catch {} }

let sample = null, tts = null, dict = null, voiceOn = true, busy = false;
try { voiceOn = localStorage.getItem('jarvis-voz') !== 'off'; } catch {}

/* ---------------- 3. Cerebro, oído y voz ---------------- */
async function boot() {
  if (!window.claude || !window.claude.use) {
    chip(ui.chipBrain, 'CEREBRO · SIN CONEXIÓN', false); chip(ui.chipMic, 'MIC · NO', false); chip(ui.chipVoice, 'VOZ · NO', false);
    return;
  }
  const [s, t, d] = await Promise.all([claude.use('sample'), claude.use('tts'), claude.use('dictation')]);
  sample = s; tts = t; dict = d;
  chip(ui.chipBrain, sample ? 'CEREBRO · CLAUDE' : 'CEREBRO · NO DISPONIBLE', !!sample);
  updateVoiceChip();
  if (dict) {
    ui.mic.hidden = false; chip(ui.chipMic, 'MIC · LISTO', true);
    let partial = null;
    dict.onPartial(({ text }) => { ui.text.value = (ui.text.dataset.base || '') + text; });
    dict.onFinal(({ text }) => { ui.text.dataset.base = ((ui.text.dataset.base || '') + text + ' '); ui.text.value = ui.text.dataset.base; });
    dict.onState(({ state, reason }) => {
      const live = state === 'listening' || state === 'starting';
      ui.mic.classList.toggle('live', live);
      ui.mic.setAttribute('aria-label', live ? 'Dejar de escuchar' : 'Hablar');
      if (live) setMode('listening');
      if (state === 'idle') {
        if (reason === 'not_granted') { ui.mic.hidden = true; chip(ui.chipMic, 'MIC · BLOQUEADO', false); }
        const said = ui.text.value.trim(); ui.text.dataset.base = '';
        if (said && !busy) { ui.text.value = ''; ask(said); } else if (!busy) setMode('idle');
      }
    });
  } else {
    chip(ui.chipMic, 'MIC · TECLADO', false);
    ui.hint.textContent = 'Para hablarle, toca la caja de texto y usa el micrófono de tu teclado; luego pulsa enviar.';
  }
}

function updateVoiceChip() {
  const can = !!tts || 'speechSynthesis' in window;
  if (!can) { chip(ui.chipVoice, 'VOZ · NO DISPONIBLE', false); ui.chipVoice.disabled = true; return; }
  chip(ui.chipVoice, voiceOn ? (tts ? 'VOZ · CLAUDE' : 'VOZ · TELÉFONO') : 'VOZ · SILENCIO', voiceOn);
  ui.chipVoice.setAttribute('aria-pressed', String(voiceOn));
}
ui.chipVoice.addEventListener('click', () => {
  voiceOn = !voiceOn;
  try { localStorage.setItem('jarvis-voz', voiceOn ? 'on' : 'off'); } catch {}
  if (!voiceOn) { try { tts && tts.stop(); } catch {} try { speechSynthesis.cancel(); } catch {} }
  updateVoiceChip();
});

ui.mic.addEventListener('click', () => {
  unlockSpeech();
  if (!dict) return;
  if (dict.active()) { dict.stop().catch(() => {}); return; }
  try { tts && tts.stop(); } catch {}
  ui.text.dataset.base = '';
  dict.start({ language: 'es' }).catch((e) => {
    if (e && e.code === 'not_granted') { ui.mic.hidden = true; chip(ui.chipMic, 'MIC · BLOQUEADO', false); }
    setMode('idle');
  });
});

// iPhone solo deja hablar al teléfono si la primera frase sale de un toque del usuario.
let unlocked = false;
function unlockSpeech() {
  if (unlocked || !('speechSynthesis' in window)) return;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); unlocked = true; } catch {}
}
function spanishVoice() {
  try {
    const vs = speechSynthesis.getVoices().filter((v) => v.lang && v.lang.toLowerCase().startsWith('es'));
    return vs.find((v) => /mx|us|419/i.test(v.lang)) || vs[0] || null;
  } catch { return null; }
}
$('test-voice').addEventListener('click', async () => {
  unlockSpeech();
  if (!voiceOn) { voiceOn = true; try { localStorage.setItem('jarvis-voz', 'on'); } catch {} updateVoiceChip(); }
  const msg = 'Hola, soy Jarvis. Si me escuchas, la voz está lista.';
  addMsg('jarvis', msg); ui.hint.hidden = true;
  await speak(msg);
  setMode('idle');
});

ui.form.addEventListener('submit', (e) => {
  e.preventDefault();
  unlockSpeech();
  const t = ui.text.value.trim();
  if (!t || busy) return;
  ui.text.value = ''; ui.text.dataset.base = '';
  if (dict && dict.active()) dict.stop().catch(() => {});
  ask(t);
});

async function ask(text) {
  ui.hint.hidden = true;
  if (!sample) { addMsg('err', 'No puedo pensar aquí: abre esta página desde la app de Claude o claude.ai con tu sesión iniciada.'); return; }
  busy = true; ui.send.disabled = true;
  addMsg('you', text);
  history.push({ role: 'user', content: text });
  const now = new Date().toLocaleString('es', { dateStyle: 'full', timeStyle: 'short' });
  const msgs = history.slice(-16).map((m) => ({ ...m }));
  while (msgs.length && msgs[0].role !== 'user') msgs.shift();
  msgs[0] = { role: 'user', content: `[Instrucciones]\n${SYSTEM}\nFecha y hora del usuario: ${now}.\n\n[Usuario]\n${msgs[0].content}` };
  const out = addMsg('jarvis', '…');
  setMode('thinking');
  try {
    const r = await sample(msgs, { cache: false, modelTier: 'default', onText: ({ text: t }) => { out.textContent = t; ui.log.scrollTop = ui.log.scrollHeight; } });
    const reply = (r.text || '').trim() || '…';
    out.textContent = reply;
    history.push({ role: 'assistant', content: reply }); saveHistory();
    await speak(reply);
  } catch (e) {
    history.pop();
    out.className = 'msg err';
    const code = e && e.code;
    out.textContent = code === 'not_granted' ? 'Necesito tu permiso para preguntarle a Claude. Vuelve a enviar y acepta el aviso.'
      : code === 'rate_limited' ? 'Demasiadas preguntas seguidas. Espera un momento y vuelve a intentarlo.'
      : 'No pude responder: ' + ((e && e.message) || 'error desconocido') + '.';
  } finally {
    busy = false; ui.send.disabled = false; setMode('idle');
  }
}

async function speak(text) {
  if (!voiceOn || !text) return;
  setMode('speaking');
  if (tts) {
    try { await tts.speak(text.slice(0, 2000), { language: 'es' }); return; }
    catch (e) { if (e && e.code === 'not_granted') { tts = null; updateVoiceChip(); } else if (e && e.code === 'viewer_stopped') return; }
  }
  if ('speechSynthesis' in window) {
    await new Promise((res) => {
      try {
        const u = new SpeechSynthesisUtterance(text); const v = spanishVoice();
        if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'es-ES';
        u.onend = u.onerror = res; speechSynthesis.speak(u);
        setTimeout(res, Math.max(4000, text.length * 90));
      } catch { res(); }
    });
  }
}

boot();
</script>
