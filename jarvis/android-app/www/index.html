<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jarvis</title>
  <style>
    :root { --bg: #03060d; --panel: #0a1424; --gold: #ffb52e; --gold-dim: rgba(255,181,46,.35); --text: #f4e6c4; --muted: #8ea2bd; --warn: #ff8a65; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(120% 80% at 50% 30%, var(--panel), var(--bg) 70%); color: var(--text);
      font: 16px system-ui, sans-serif; display: flex; flex-direction: column; justify-content: center; gap: 18px;
      padding: calc(24px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }
    img { width: 120px; height: 120px; margin: 0 auto; border-radius: 50%; box-shadow: 0 0 40px var(--gold-dim); }
    h1 { margin: 0; text-align: center; letter-spacing: .45em; font: 18px ui-monospace, monospace; color: var(--gold); }
    p { margin: 0; color: var(--muted); line-height: 1.45; font-size: 14px; }
    label { font: 12px ui-monospace, monospace; letter-spacing: .12em; color: var(--muted); }
    input { width: 100%; font: 16px system-ui; color: var(--text); background: var(--bg); border: 1px solid var(--gold-dim); border-radius: 2px; padding: 12px; margin-top: 6px; }
    input:focus { outline: none; border-color: var(--gold); }
    button { font: 15px ui-monospace, monospace; letter-spacing: .15em; padding: 14px; border-radius: 2px; border: 1px solid var(--gold); background: var(--gold); color: var(--bg); }
    button.ghost { background: transparent; color: var(--gold); }
    .err { color: var(--warn); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <img src="icon.png" alt="">
  <h1>J.A.R.V.I.S.</h1>

  <section id="setup" hidden>
    <p>Conecta esta app con el Jarvis de tu PC. Los dos datos aparecen en la ventana de Jarvis del PC al encenderlo.</p>
    <div style="margin-top:14px"><label for="url">DIRECCIÓN DE TU PC (TAILSCALE)</label>
      <input id="url" type="url" inputmode="url" placeholder="https://mi-pc.tu-red.ts.net" autocomplete="off"></div>
    <div style="margin-top:12px"><label for="key">CLAVE DE JARVIS</label>
      <input id="key" type="password" placeholder="La clave que muestra tu PC" autocomplete="off"></div>
    <p id="error" class="err" hidden style="margin-top:12px"></p>
    <button id="save" style="margin-top:16px;width:100%">CONECTAR</button>
  </section>

  <section id="connecting" hidden>
    <p style="text-align:center">Conectando con tu PC…</p>
    <button id="change" class="ghost" style="margin-top:16px;width:100%">CAMBIAR DIRECCIÓN</button>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);
    const get = (k) => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
    const set = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

    function go(url, key) {
      $('setup').hidden = true; $('connecting').hidden = false;
      // La clave viaja en el fragmento (#), que nunca se envía a ningún servidor.
      setTimeout(() => { location.href = url.replace(/\/$/, '') + '/#k=' + encodeURIComponent(key); }, 600);
    }
    function showSetup(msg) {
      $('setup').hidden = false; $('connecting').hidden = true;
      $('url').value = get('hub-url'); $('key').value = get('hub-key');
      $('error').hidden = !msg; $('error').textContent = msg || '';
    }
    $('save').onclick = () => {
      const url = $('url').value.trim(), key = $('key').value.trim();
      if (!/^https:\/\/[^/]+\.ts\.net\/?$/i.test(url)) return showSetup('La dirección debe ser la de Tailscale, por ejemplo https://mi-pc.tu-red.ts.net');
      if (key.length < 8) return showSetup('Escribe la clave completa que muestra tu PC.');
      set('hub-url', url); set('hub-key', key); go(url, key);
    };
    $('change').onclick = () => { clearTimeout(window.__t); showSetup(); };
    const url = get('hub-url'), key = get('hub-key');
    if (url && key && !location.hash.includes('setup')) { $('connecting').hidden = false; window.__t = setTimeout(() => go(url, key), 1200); }
    else showSetup();
  </script>
</body>
</html>
