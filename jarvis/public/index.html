<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis</title>
  <meta name="theme-color" content="#03060d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="room" aria-hidden="true">
    <div class="beam"></div>
    <div class="pillar"></div>
    <div class="floor"></div>
  </div>

  <canvas id="orb" aria-label="Núcleo holográfico de Jarvis"></canvas>

  <header class="hud hud-top">
    <div class="brand">J.A.R.V.I.S.</div>
    <div class="chips">
      <span class="chip" id="chip-brain">CEREBRO · …</span>
      <span class="chip" id="chip-voice">VOZ · …</span>
      <span class="chip" id="chip-mic">MIC · …</span>
      <button class="chip ok settings-toggle" id="settings-toggle" type="button" aria-expanded="false" aria-controls="side">AJUSTES</button>
    </div>
  </header>

  <aside class="hud hud-side" id="side">
    <label for="brain">Cerebro</label>
    <select id="brain">
      <option value="claude">Claude Code</option>
      <option value="ollama">IA de código abierto (Ollama)</option>
    </select>
    <label for="session" id="session-label">Chat de Claude Code</label>
    <select id="session">
      <option value="">Nueva conversación</option>
    </select>
    <label class="toggle"><input type="checkbox" id="handsfree"> Manos libres</label>
    <div class="gmail" id="gmail">
      <span class="gmail-state" id="gmail-state">Gmail · …</span>
      <button type="button" class="act" id="gmail-connect" hidden>Conectar Gmail</button>
      <button type="button" class="act" id="gmail-summary" hidden>Resumir correos</button>
      <label class="toggle" id="mail-alerts-row" hidden><input type="checkbox" id="mail-alerts" checked> Avisarme de correos nuevos</label>
    </div>
    <div class="tools" id="tools"></div>
  </aside>

  <main class="hud hud-bottom">
    <div class="status" id="status">EN ESPERA</div>
    <p class="line you" id="you"></p>
    <p class="line reply" id="reply">Toca el núcleo o pulsa Espacio para hablar.</p>
    <form id="form" autocomplete="off">
      <input id="text" type="text" placeholder="…o escribe aquí y pulsa Enter" aria-label="Mensaje">
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
