<style id="mw-style">
/* Layout: una columna centrada; en escritorio el cliente ve el formulario a la izquierda y el estimado fijo a la derecha. */
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f6f8fb; --ink: #121821; --ink-2: #3c4757; --mute: #677385;
  --line: #d9e0e8; --accent: #1f6fe5; --accent-2: #1659c0; --accent-soft: #e3edfd; --on-accent: #ffffff;
  --ok: #1a8a60; --ok-soft: #e1f4ec; --warn: #a3650f; --warn-soft: #fbf0dc; --bad: #c23a30;
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0f14; --surface: #121922; --surface-2: #17202b; --ink: #e6edf5; --ink-2: #b4c0ce; --mute: #8592a4;
  --line: #263345; --accent: #3a8dff; --accent-2: #63a5ff; --accent-soft: #14294a; --on-accent: #04101f;
  --ok: #3cc08d; --ok-soft: #10301f; --warn: #f0b341; --warn-soft: #33270f; --bad: #f2645a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0b0f14; --surface: #121922; --surface-2: #17202b; --ink: #e6edf5; --ink-2: #b4c0ce; --mute: #8592a4;
  --line: #263345; --accent: #3a8dff; --accent-2: #63a5ff; --accent-soft: #14294a; --on-accent: #04101f;
  --ok: #3cc08d; --ok-soft: #10301f; --warn: #f0b341; --warn-soft: #33270f; --bad: #f2645a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.muted { color: var(--mute); }
.small { font-size: 13px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 40px; height: 40px; flex: none; }
.tabs { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tabs button { border: 0; background: none; color: var(--mute); font: inherit; font-weight: 500; font-size: 14px; padding: 7px 14px; border-radius: 7px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.stack { display: grid; gap: 16px; }
.grid2 { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
.sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .sticky { position: static; } }

.step { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.step b { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 500; }

.choices { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.choice { text-align: left; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 10px; padding: 11px 12px; font: inherit; cursor: pointer; transition: border-color .15s, background-color .15s, transform .1s; }
.choice:hover { border-color: var(--accent-2); }

.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice .t { display: block; font-weight: 600; font-size: 14.5px; }
.choice .d { display: block; font-size: 12.5px; color: var(--mute); margin-top: 2px; }

label.f { display: grid; gap: 5px; font-size: 13px; font-weight: 500; color: var(--ink-2); min-width: 0; }
label.f .u { font-family: var(--mono); font-size: 11px; color: var(--mute); font-weight: 400; }

.range { font-family: var(--mono); font-size: 14px; color: var(--ink-2); margin-top: 4px; }
.lines { display: grid; gap: 6px; margin: 14px 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13.5px; }
.lines div { display: flex; justify-content: space-between; gap: 10px; }
.notice { border-radius: 9px; padding: 10px 12px; font-size: 13px; line-height: 1.45; background: var(--warn-soft); color: var(--warn); }
.notice.info { background: var(--accent-soft); color: var(--ink-2); }
.notice.ok { background: var(--ok-soft); color: var(--ok); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--surface-2); }
.seg button { border: 0; background: none; font: inherit; font-size: 13.5px; color: var(--mute); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

.done { max-width: 560px; margin: 0 auto; }
.check { width: 48px; height: 48px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; margin-bottom: 12px; }
.summary { display: grid; gap: 8px; margin: 14px 0; padding: 12px; border-radius: 10px; background: var(--surface-2); font-size: 14px; }
.summary div { display: flex; justify-content: space-between; gap: 12px; }

/* Panel del dueño */
.otype { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface-2); display: grid; gap: 12px; }
.formula { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; }
.formula .op { font-family: var(--mono); color: var(--mute); padding-bottom: 10px; }
.formula label.f { width: 104px; }
.rate { font-family: var(--mono); font-size: 12.5px; color: var(--ok); }
.savebar { position: sticky; bottom: 0; margin-top: 18px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; box-shadow: 0 -6px 18px rgba(0,0,0,.06); }
.checklist { display: grid; gap: 6px; font-size: 14px; }
.checklist span { display: flex; gap: 8px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 9px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.copybox { width: 100%; min-height: 160px; font-family: var(--mono); font-size: 12.5px; }
.metal-head, .metal-row { display: grid; grid-template-columns: minmax(0, 1fr) 140px 84px; gap: 8px; align-items: center; }
.sub-h { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
.rate b { color: var(--ink); }
@media (max-width: 480px) { .metal-head, .metal-row { grid-template-columns: minmax(0, 1fr) 104px 70px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="mw-main">
(() => {
  'use strict';

  /* ───────── Configuración ───────── */
  const PUBLISHED = JSON.parse(document.getElementById('mw-config').textContent);
  const DRAFT_KEY = 'estimador.borrador.v2';
  const clone = (o) => JSON.parse(JSON.stringify(o));
  let cfg = clone(PUBLISHED);
  let dirty = false;

  const $app = document.getElementById('app');
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
  const uid = () => Math.random().toString(36).slice(2, 9);

  const U = () => cfg.unit === 'm'
    ? { len: 'm', one: 'metro', area: 'm²', sub: 'cm', subPer: 100 }
    : { len: 'pies', one: 'pie', area: 'pies²', sub: 'pulg', subPer: 12 };
  const money = (n, dec = 0) => new Intl.NumberFormat(cfg.currency === 'MXN' ? 'es-MX' : 'en-US', { style: 'currency', currency: cfg.currency, minimumFractionDigits: dec, maximumFractionDigits: dec }).format(n || 0);
  const fmt = (n, d = 2) => new Intl.NumberFormat('en-US', { maximumFractionDigits: d }).format(n || 0);

  /* ───────── Cálculo (el «cerebro») ─────────
     MATERIAL: pies de metal según la forma del trabajo × precio por pie del proveedor × (1 + desperdicio).
       Área (portón, reja, puerta): marco = 2·(ancho + alto); travesaños = n × ancho;
         barrotes verticales cada S pulgadas = (⌈ancho·12 / S⌉ − 1) × alto.
       Largo (barandal): pasamanos/soleras = n × largo; postes cada P pies = (⌈largo / P⌉ + 1) × alto;
         barrotes = (⌈largo·12 / S⌉ − 1) × alto.
       Pieza: material fijo por pieza.
     MANO DE OBRA: el ejemplo del dueño fija la carga (personas × días para el tamaño del ejemplo).
       Carga del cliente = carga del ejemplo × (tamaño / tamaño del ejemplo).
       Personas = 1 si la carga cabe en un día de una persona; si no, hasta el máximo (2).
       Días = carga ÷ personas, redondeado a medio día. Cada persona cobra días × pago diario, con mínimo por persona.
     DISEÑO: cambia la separación de barrotes y suma un % por detalles.
  */
  const roundUp = (n) => { const r = num(cfg.roundTo); return r > 0 ? Math.ceil(n / r - 1e-9) * r : Math.round(n); };
  const roundDown = (n) => { const r = num(cfg.roundTo); return r > 0 ? Math.floor(n / r) * r : Math.round(n); };
  const metal = (id) => cfg.metals.find((m) => m.id === id) || null;
  const metalPrice = (id) => num(metal(id)?.price);

  function sizeOf(t, a, b) { return t.mode === 'area' ? num(a) * num(b) : t.mode === 'lineal' ? num(a) : 1; }

  /** Pies de metal por pieza, separados por metal. */
  function metalFeet(t, a, b, spacing) {
    const u = U(), A = num(a), B = num(b), S = num(spacing);
    const parts = [];
    if (t.mode === 'area') {
      if (A <= 0 || B <= 0) return parts;
      parts.push({ id: t.frameMetal, what: 'marco y travesaños', len: 2 * (A + B) + Math.max(0, Math.floor(num(t.rails))) * A });
      if (S > 0 && t.barMetal) {
        const bars = Math.max(0, Math.ceil((A * u.subPer) / S) - 1);
        if (bars) parts.push({ id: t.barMetal, what: `${bars} barrotes`, len: bars * B });
      }
    } else if (t.mode === 'lineal') {
      const H = num(t.height), P = num(t.postEvery);
      if (A <= 0) return parts;
      const posts = P > 0 ? Math.ceil(A / P) + 1 : 2;
      parts.push({ id: t.frameMetal, what: `pasamanos y ${posts} postes`, len: Math.max(0, Math.floor(num(t.rails))) * A + posts * H });
      if (S > 0 && t.barMetal && H > 0) {
        const bars = Math.max(0, Math.ceil((A * u.subPer) / S) - 1);
        if (bars) parts.push({ id: t.barMetal, what: `${bars} barrotes`, len: bars * H });
      }
    }
    return parts;
  }

  function materialCost(t, a, b, spacing) {
    if (t.mode === 'pieza') return { cost: num(t.material), parts: [], missing: !(num(t.material) > 0) };
    const parts = metalFeet(t, a, b, spacing);
    let missing = false, cost = 0;
    for (const p of parts) {
      const price = metalPrice(p.id);
      if (!(price > 0)) missing = true;
      cost += p.len * price;
    }
    return { cost: cost * (1 + num(cfg.wastePct) / 100), parts, missing };
  }

  function laborFor(t, sizeTotal) {
    const L = cfg.labor;
    const refSize = sizeOf(t, t.refA, t.refB);
    const refLoad = num(t.refPersons) * num(t.refDays);
    if (!(refSize > 0) || !(refLoad > 0) || !(sizeTotal > 0)) return { persons: 0, days: 0, cost: 0 };
    const load = refLoad * (sizeTotal / refSize);                      // personas·día
    const max = Math.max(1, Math.floor(num(L.maxPersons) || 1));
    const persons = load <= 1 ? 1 : Math.min(max, Math.ceil(load));
    const days = Math.max(0.5, Math.ceil((load / persons) * 2 - 1e-9) / 2);
    const perPerson = Math.max(num(L.minPerPerson), days * num(L.payPerDay));
    return { persons, days, perPerson, cost: persons * perPerson };
  }

  /** ¿El trabajo se puede cotizar? (tiene precio de metal o de material, y ejemplo de mano de obra) */
  function priced(t) {
    if (!t.active) return false;
    const refOk = sizeOf(t, t.refA, t.refB) > 0 && num(t.refPersons) > 0 && num(t.refDays) > 0;
    if (t.mode === 'pieza') return refOk && num(t.material) > 0;
    return refOk && metalPrice(t.frameMetal) > 0 && (!t.barMetal || metalPrice(t.barMetal) > 0);
  }

  function itemCalc(it) {
    const t = cfg.types.find((x) => x.id === it.typeId);
    const d = cfg.designs.find((x) => x.id === it.designId) || cfg.designs[0];
    if (!t) return null;
    const qty = Math.max(1, Math.floor(num(it.qty) || 1));
    const complete = t.mode === 'area' ? num(it.a) > 0 && num(it.b) > 0 : t.mode === 'lineal' ? num(it.a) > 0 : true;
    const m = materialCost(t, it.a, it.b, d?.spacing);
    const material = m.cost * qty;
    const labor = laborFor(t, sizeOf(t, it.a, it.b) * qty);
    const base = material + labor.cost;
    const designExtra = base * (num(d?.pct) / 100);
    let total = base + designExtra;
    const minTotal = num(t.min) * qty;
    const minApplied = total > 0 && total < minTotal;
    if (minApplied) total = minTotal;
    if (total > 0) total = roundUp(total);
    return { t, d, qty, complete, parts: m.parts, material, labor, designExtra, total, minApplied, size: sizeOf(t, it.a, it.b) };
  }

  function estimate(items) {
    const calcs = items.map(itemCalc).filter((c) => c && c.complete && c.total > 0);
    const total = calcs.reduce((s, c) => s + c.total, 0);
    const p = num(cfg.rangePct) / 100;
    return { calcs, total, low: roundDown(total * (1 - p)), high: roundUp(total * (1 + p)) };
  }

  const laborText = (l) => l.persons ? `${l.persons} ${l.persons === 1 ? 'persona' : 'personas'} × ${fmt(l.days, 1)} ${l.days === 1 ? 'día' : 'días'}` : '';
  const partsText = (parts, qty) => parts.map((p) => `${fmt(p.len * qty, 1)} ${U().len} de ${metal(p.id)?.name || 'metal'} (${p.what})`).join('; ');

  /* ───────── Estado ───────── */
  let view = 'cliente';
  let canEdit = false;
  let art = null;
  const newItem = () => {
    const first = cfg.types.find(priced);
    return { id: uid(), typeId: first ? first.id : '', a: '', b: '', qty: 1, designId: cfg.designs[0]?.id || '' };
  };
  let client = { items: [newItem()], name: '', phone: '', via: 'whatsapp', address: '', notes: '', tried: false };
  let sent = null;

  /* ───────── Teléfono y mensaje ───────── */
  const digits = (s) => String(s || '').replace(/\D/g, '');
  function intlPhone(raw) { let d = digits(raw); if (d.length === 10) d = digits(cfg.countryCode) + d; return d; }
  const phoneOk = (raw) => { const d = digits(raw); return d.length >= 10 && d.length <= 15; };
  function folio() {
    const t = new Date(), p = (n) => String(n).padStart(2, '0');
    return `C${String(t.getFullYear()).slice(2)}${p(t.getMonth() + 1)}${p(t.getDate())}-${p(t.getHours())}${p(t.getMinutes())}${String(Math.floor(Math.random() * 90) + 10)}`;
  }
  function describeItem(c, it) {
    const u = U();
    const m = c.t.mode === 'area' ? `${fmt(num(it.a))} × ${fmt(num(it.b))} ${u.len} (${fmt(c.size)} ${u.area})`
      : c.t.mode === 'lineal' ? `${fmt(num(it.a))} ${u.len} de largo` : 'por pieza';
    return `${c.t.name} — ${m}${c.qty > 1 ? ` × ${c.qty}` : ''} — diseño ${c.d ? c.d.name.toLowerCase() : ''}`;
  }
  function ownerMessage(s) {
    const lines = [
      `*Nueva cotización ${s.folio}*`,
      `Cliente: ${s.name}`,
      `${s.via === 'sms' ? 'Celular (prefiere SMS)' : 'WhatsApp'}: +${s.phone}`,
      s.via === 'whatsapp' ? `Abrir chat: https://wa.me/${s.phone}` : null,
      s.address ? `Ubicación: ${s.address}` : null,
      '',
      ...s.items.map((x, i) => [
        `${i + 1}) ${x.text}`,
        x.metal ? `   Metal: ${x.metal}` : null,
        `   Material: ${money(x.material)} · Mano de obra: ${money(x.labor)} (${x.laborText})`,
        x.extra ? `   Diseño: +${money(x.extra)}` : null,
        x.minApplied ? '   (se aplicó el precio mínimo)' : null,
        `   Estimado: ${money(x.total)}`,
      ].filter((l) => l !== null).join('\n')),
      '',
      `*Estimado total: ${money(s.total)}*`,
      `Rango: ${money(s.low)} – ${money(s.high)}`,
      s.notes ? `\nComentarios: ${s.notes}` : null,
      '',
      '_Estimado automático. El precio final puede variar._',
    ];
    return lines.filter((l) => l !== null).join('\n').replace(/\n{3,}/g, '\n\n');
  }
  const waLink = (to, text) => `https://wa.me/${digits(to)}?text=${encodeURIComponent(text)}`;

  /* ───────── Avisos ───────── */
  let toastTimer;
  function toast(text) {
    let el = document.querySelector('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = text; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2800);
  }

  /* ───────── Render general ───────── */
  const markSvg = `<svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect x=".5" y=".5" width="39" height="39" rx="9" fill="var(--surface)" stroke="var(--line)"/><path d="M9 31V13l11-5 11 5v18" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/><path d="M14 31V17m6 14V15m6 16V17M9 24h22" stroke="var(--ink-2)" stroke-width="1.6"/></svg>`;

  function render() {
    const tabs = canEdit ? `<div class="tabs" role="tablist">
        <button role="tab" aria-selected="${view === 'cliente'}" data-act="view" data-v="cliente">Lo que ve el cliente</button>
        <button role="tab" aria-selected="${view === 'dueno'}" data-act="view" data-v="dueno">Precios (dueño)</button>
      </div>` : '';
    $app.innerHTML = `
      <header class="top">
        <div class="brand">${markSvg}<div style="min-width:0"><div class="eyebrow">${view === 'dueno' ? 'Panel del dueño' : 'Cotización al instante'}</div><h1>${esc(cfg.business || 'Herrería')}</h1></div></div>
        ${tabs}
      </header>
      <main id="main">${view === 'dueno' && canEdit ? ownerView() : sent ? sentView() : clientView()}</main>`;
    if (view !== 'dueno' && !sent) refreshEstimate();
  }

  /* ───────── Vista del cliente ───────── */
  function clientView() {
    const available = cfg.types.filter(priced);
    if (!available.length) {
      return `<div class="card done"><h2>Muy pronto</h2><p class="muted" style="margin-top:6px">El taller está preparando sus precios. Vuelve más tarde para cotizar al instante.</p></div>`;
    }
    return `<div class="grid2">
      <div class="stack">
        ${client.items.map((it, i) => itemView(it, i, available)).join('')}
        <button class="btn" data-act="add-item" type="button">+ Agregar otro trabajo</button>
        <section class="card stack" aria-labelledby="h-datos">
          <div class="step"><b>${client.items.length + 1 < 10 ? '0' : ''}${client.items.length + 1}</b><h2 id="h-datos">Tus datos para enviarte la cotización</h2></div>
          <div class="row">
            <label class="f">Nombre<input class="in ${client.tried && !client.name.trim() ? 'bad' : ''}" id="c-name" data-c="name" value="${esc(client.name)}" autocomplete="name"></label>
            <label class="f">WhatsApp o celular <span class="u">con lada</span><input class="in ${client.tried && !phoneOk(client.phone) ? 'bad' : ''}" id="c-phone" data-c="phone" value="${esc(client.phone)}" inputmode="tel" autocomplete="tel" placeholder="Ej. 555 123 4567"></label>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><span class="small muted">¿Cómo te contactamos?</span>
            <div class="seg"><button type="button" data-act="via" data-v="whatsapp" aria-pressed="${client.via === 'whatsapp'}">WhatsApp</button><button type="button" data-act="via" data-v="sms" aria-pressed="${client.via === 'sms'}">Mensaje SMS</button></div>
          </div>
          <label class="f">Ciudad o colonia <span class="u">opcional</span><input class="in" id="c-address" data-c="address" value="${esc(client.address)}"></label>
          <label class="f">Comentarios <span class="u">opcional</span><textarea class="in" id="c-notes" data-c="notes" placeholder="Color, tipo de apertura, si incluye instalación…">${esc(client.notes)}</textarea></label>
          <div id="c-errors" class="err" aria-live="polite"></div>
        </section>
      </div>
      <aside class="sticky"><section class="card est" id="estimate" aria-live="polite"></section></aside>
    </div>`;
  }

  function itemView(it, i, available) {
    const t = cfg.types.find((x) => x.id === it.typeId);
    const u = U();
    const fields = !t ? '' : t.mode === 'area'
      ? `<label class="f">Ancho <span class="u">${u.len}</span><input class="in" id="a-${it.id}" data-i="${it.id}" data-k="a" value="${esc(it.a)}" inputmode="decimal"></label>
         <label class="f">Alto <span class="u">${u.len}</span><input class="in" id="b-${it.id}" data-i="${it.id}" data-k="b" value="${esc(it.b)}" inputmode="decimal"></label>`
      : t.mode === 'lineal'
      ? `<label class="f">Largo <span class="u">${u.len}</span><input class="in" id="a-${it.id}" data-i="${it.id}" data-k="a" value="${esc(it.a)}" inputmode="decimal"></label>`
      : '';
    return `<section class="item" aria-label="Trabajo ${i + 1}">
      <div class="item-head"><div class="step" style="margin:0"><b>0${i + 1}</b><h2>¿Qué necesitas?</h2></div>
        ${client.items.length > 1 ? `<button class="btn sm ghost" type="button" data-act="del-item" data-i="${it.id}">Quitar</button>` : ''}</div>
      <div class="choices">${available.map((x) => `<button type="button" class="choice" data-act="type" data-i="${it.id}" data-v="${esc(x.id)}" aria-pressed="${x.id === it.typeId}"><span class="t">${esc(x.name)}</span><span class="d">${x.mode === 'area' ? 'Ancho × alto' : x.mode === 'lineal' ? 'Por largo' : 'Por pieza'}</span></button>`).join('')}</div>
      ${t ? `<div class="row" style="margin-top:14px">${fields}<label class="f">Cantidad<input class="in" id="q-${it.id}" data-i="${it.id}" data-k="qty" value="${esc(it.qty)}" inputmode="numeric"></label></div>
      ${t.mode !== 'pieza' ? `<div class="sketch" id="sk-${it.id}">${sketch(it, t)}</div>` : ''}
      <div style="margin-top:14px"><div class="small muted" style="margin-bottom:6px">Diseño</div>
        <div class="choices">${cfg.designs.map((d) => `<button type="button" class="choice" data-act="design" data-i="${it.id}" data-v="${esc(d.id)}" aria-pressed="${d.id === it.designId}"><span class="t">${esc(d.name)}</span><span class="d">${esc(d.desc)}</span></button>`).join('')}</div>
      </div>` : ''}
    </section>`;
  }

  // Dibujo a escala: el claro con sus barrotes reales según el diseño elegido, o el tramo de barandal con sus postes.
  function sketch(it, t) {
    const u = U();
    const d = cfg.designs.find((x) => x.id === it.designId) || cfg.designs[0];
    const S = num(d?.spacing);
    if (t.mode === 'lineal') {
      const L = num(it.a), P = num(t.postEvery);
      const posts = L > 0 && P > 0 ? Math.min(12, Math.ceil(L / P) + 1) : 4;
      return `<svg viewBox="0 0 120 84" aria-hidden="true"><path d="M8 58h104M8 24h104" stroke="var(--accent)" stroke-width="2.4"/>${Array.from({ length: posts }, (_, k) => `<path d="M${8 + (104 / (posts - 1)) * k} 60V22" stroke="var(--ink-2)" stroke-width="2.6"/>`).join('')}${Array.from({ length: 20 }, (_, k) => `<path d="M${10 + k * 5.2} 56V26" stroke="var(--accent)" stroke-width=".8" opacity=".5"/>`).join('')}<path d="M8 70h104" stroke="var(--mute)" stroke-width=".8"/><text x="60" y="81" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-2)">${L ? fmt(L) + ' ' + u.len : 'largo'}</text></svg>
      <div class="small"><div class="muted">Medida a cotizar</div><div class="num">${L ? `${fmt(L * Math.max(1, num(it.qty)))} ${u.len} lineales` : 'Escribe el largo'}</div>${L ? `<div class="muted">${posts} postes</div>` : ''}</div>`;
    }
    const A = num(it.a), B = num(it.b);
    const W = 92, H = 56;
    let w = W, h = H;
    if (A > 0 && B > 0) { const k = Math.min(W / A, H / B); w = Math.max(10, A * k); h = Math.max(10, B * k); }
    const x = 14 + (W - w) / 2, y = 6 + (H - h) / 2;
    const realBars = A > 0 && S > 0 ? Math.max(0, Math.ceil((A * u.subPer) / S) - 1) : 6;
    const drawBars = Math.min(realBars, 40);
    const rails = Math.max(0, Math.floor(num(t.rails)));
    return `<svg viewBox="0 0 120 84" aria-hidden="true">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>
      ${Array.from({ length: drawBars }, (_, k) => `<path d="M${x + (w / (drawBars + 1)) * (k + 1)} ${y}v${h}" stroke="var(--accent)" stroke-width=".8" opacity=".6"/>`).join('')}
      ${Array.from({ length: rails }, (_, k) => `<path d="M${x} ${y + (h / (rails + 1)) * (k + 1)}h${w}" stroke="var(--accent)" stroke-width="1.6"/>`).join('')}
      <path d="M${x} 72h${w}" stroke="var(--mute)" stroke-width=".8"/><path d="M${x} 69v6M${x + w} 69v6" stroke="var(--mute)" stroke-width=".8"/>
      <text x="${x + w / 2}" y="82" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--ink-2)">${A ? fmt(A) : 'ancho'}</text>
      <text x="${x + w + 4}" y="${y + h / 2 + 3}" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--ink-2)">${B ? fmt(B) : 'alto'}</text>
    </svg>
    <div class="small"><div class="muted">Superficie</div><div class="num">${A && B ? `${fmt(A * B * Math.max(1, num(it.qty)))} ${u.area}` : 'Escribe ancho y alto'}</div>${A && B && S ? `<div class="muted">${realBars} barrotes cada ${fmt(S)} ${u.sub}</div>` : ''}</div>`;
  }

  function refreshEstimate() {
    const box = document.getElementById('estimate');
    if (!box) return;
    const e = estimate(client.items);
    const pending = client.items.some((it) => { const c = itemCalc(it); return !c || !c.complete; });
    box.innerHTML = e.total > 0 ? `
      <div class="eyebrow">Tu estimado</div>
      <div class="big" style="margin-top:6px">${money(e.total)}</div>
      <div class="range">Entre ${money(e.low)} y ${money(e.high)}</div>
      <div class="lines">${e.calcs.map((c) => `<div style="display:grid;gap:2px"><div><span>${esc(c.t.name)}${c.qty > 1 ? ` × ${c.qty}` : ''} <span class="muted">· ${esc(c.d ? c.d.name : '')}</span></span><span class="num">${money(c.total)}</span></div>
          <div class="muted small"><span>Material y mano de obra (${esc(laborText(c.labor))})</span></div></div>`).join('')}
        ${pending ? `<div class="muted small"><span>Completa las medidas que faltan</span></div>` : ''}</div>
      <p class="notice">${esc(cfg.disclaimer)}</p>
      <button class="btn primary block" style="margin-top:14px" type="button" data-act="submit">Obtener mi cotización</button>
      <p class="small muted" style="margin-top:8px">Te pediremos tu nombre y número para enviarte la cotización.</p>`
      : `<div class="eyebrow">Tu estimado</div>
      <div class="big muted" style="margin-top:6px">—</div>
      <p class="small muted" style="margin-top:8px">Elige el trabajo y escribe las medidas: el precio aparece al instante.</p>`;
  }

  function submit() {
    client.tried = true;
    const e = estimate(client.items);
    const errs = [];
    if (!e.total) errs.push('Completa las medidas del trabajo.');
    if (!client.name.trim()) errs.push('Escribe tu nombre.');
    if (!phoneOk(client.phone)) errs.push('Escribe tu número de WhatsApp o celular con lada (10 dígitos o más).');
    if (errs.length) {
      render();
      const box = document.getElementById('c-errors');
      if (box) box.textContent = errs.join(' ');
      (document.querySelector('.in.bad') || document.getElementById('c-name'))?.focus();
      return;
    }
    sent = {
      folio: folio(), name: client.name.trim(), phone: intlPhone(client.phone), via: client.via,
      address: client.address.trim(), notes: client.notes.trim(),
      items: client.items.map((it) => ({ it, c: itemCalc(it) })).filter((x) => x.c && x.c.complete && x.c.total > 0).map((x) => ({
        text: describeItem(x.c, x.it), total: x.c.total, material: x.c.material, labor: x.c.labor.cost,
        laborText: laborText(x.c.labor), metal: partsText(x.c.parts, x.c.qty), extra: x.c.designExtra, minApplied: x.c.minApplied,
      })),
      total: e.total, low: e.low, high: e.high,
    };
    render();
    window.scrollTo({ top: 0 });
  }

  function sentView() {
    const s = sent;
    const msg = ownerMessage(s);
    const ownerOk = phoneOk(cfg.whatsapp);
    return `<section class="card done stack">
      <div><div class="check"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
        <div class="eyebrow">Cotización ${esc(s.folio)}</div><h2 style="font-size:22px;margin-top:4px">¡Listo, ${esc(s.name.split(' ')[0])}! Tu cotización está lista</h2></div>
      <div class="summary">${s.items.map((x) => `<div><span>${esc(x.text)}</span><span class="num">${money(x.total)}</span></div>`).join('')}
        <div style="border-top:1px solid var(--line);padding-top:8px;font-weight:600"><span>Estimado total</span><span class="num">${money(s.total)}</span></div>
        <div class="muted small"><span>Rango posible</span><span class="num">${money(s.low)} – ${money(s.high)}</span></div></div>
      <p class="notice">${esc(cfg.disclaimer)}</p>
      ${ownerOk ? `
        <a class="btn wa block" href="${esc(waLink(cfg.whatsapp, msg))}" target="_blank" rel="noopener" data-act="sent-wa">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.2-.2-.5-.3Z"/></svg>
          Enviar al WhatsApp del taller</a>
        <p class="small muted" style="text-align:center">Se abre WhatsApp con tu cotización escrita; sólo toca <b>Enviar</b>. El taller te contestará por ${s.via === 'sms' ? 'mensaje SMS' : 'WhatsApp'} al +${esc(s.phone)}.</p>`
      : `<p class="notice info">El taller todavía no registra su número de WhatsApp. Copia tu cotización y envíala por mensaje.</p>`}
      <details><summary class="small muted" style="cursor:pointer">Ver o copiar el texto de la cotización</summary>
        <textarea class="in copybox" id="copy-text" readonly style="margin-top:8px">${esc(msg)}</textarea>
        <button class="btn sm" type="button" data-act="copy" style="margin-top:8px">Copiar texto</button></details>
      <button class="btn block" type="button" data-act="new">Nueva cotización</button>
    </section>`;
  }

  /* ───────── Vista del dueño ───────── */
  function ownerView() {
    const u = U();
    const L = cfg.labor;
    return `<div class="stack">
      <section class="card stack">
        <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between">
          <div><h2>Cómo funciona</h2><p class="muted small" style="margin-top:4px;max-width:520px">1) Pon el precio por ${u.one} de cada metal según tu proveedor. 2) Di qué metal lleva cada trabajo. El estimador calcula los ${u.len} de metal con las medidas del cliente (marco, travesaños y barrotes) y suma la mano de obra según cuántas personas van. Te llega la cotización a tu WhatsApp con el número del cliente.</p></div>
          <div class="checklist" id="checklist">${checklist()}</div>
        </div>
      </section>

      <section class="card stack">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>Metal de tu proveedor</h2><button class="btn sm" type="button" data-act="add-metal">+ Metal</button></div>
        <p class="muted small">Precio por ${u.one}. Si te lo venden por tramo, divide: un tramo de 20 ${u.len} a $60 = $3 por ${u.one}.</p>
        <div class="metal-head small muted"><span>Metal</span><span>Precio por ${u.one}</span><span></span></div>
        ${cfg.metals.map((m) => `<div class="metal-row">
          <input class="in" id="mn-${esc(m.id)}" data-m="${esc(m.id)}" data-k="name" value="${esc(m.name)}" aria-label="Nombre del metal">
          <input class="in num ${!(num(m.price) > 0) && metalUsed(m.id) ? 'bad' : ''}" id="mp-${esc(m.id)}" data-m="${esc(m.id)}" data-k="price" value="${num(m.price) > 0 ? esc(m.price) : ''}" inputmode="decimal" placeholder="$ ${cfg.currency}" aria-label="Precio por ${u.one}">
          <button class="btn sm ghost" type="button" data-act="del-metal" data-v="${esc(m.id)}" ${metalUsed(m.id) ? 'disabled title="Lo usa un trabajo"' : ''}>Quitar</button>
        </div>`).join('')}
        <label class="f" style="max-width:220px">Desperdicio de material <span class="u">%</span><input class="in" id="o-waste" data-o="wastePct" value="${esc(cfg.wastePct)}" inputmode="decimal"></label>
      </section>

      <section class="card stack">
        <h2>Mano de obra</h2>
        <p class="muted small">Cada persona que va al trabajo cobra los días que tarda, con un mínimo por persona.</p>
        <div class="row">
          <label class="f">Pago por persona por día <span class="u">${cfg.currency}</span><input class="in" id="o-pay" data-l="payPerDay" value="${esc(L.payPerDay)}" inputmode="decimal"></label>
          <label class="f">Mínimo por persona <span class="u">${cfg.currency}</span><input class="in" id="o-minp" data-l="minPerPerson" value="${esc(L.minPerPerson)}" inputmode="decimal"></label>
          <label class="f">Máximo de personas<input class="in" id="o-maxp" data-l="maxPersons" value="${esc(L.maxPersons)}" inputmode="numeric"></label>
        </div>
      </section>

      <section class="card stack">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>Trabajos</h2><button class="btn sm" type="button" data-act="add-type">+ Trabajo</button></div>
        <p class="muted small">Los trabajos sin precio de metal o sin ejemplo de mano de obra no se le muestran al cliente.</p>
        ${cfg.types.map((t) => typeEditor(t)).join('')}
      </section>

      <section class="card stack">
        <h2>Diseño</h2>
        <p class="muted small">La separación de barrotes cambia cuánto metal lleva; el extra cubre detalles y adornos.</p>
        ${cfg.designs.map((d) => `<div class="row" style="align-items:end">
          <label class="f">Nombre<input class="in" id="dn-${esc(d.id)}" data-d="${esc(d.id)}" data-k="name" value="${esc(d.name)}"></label>
          <label class="f">Descripción<input class="in" id="dd-${esc(d.id)}" data-d="${esc(d.id)}" data-k="desc" value="${esc(d.desc)}"></label>
          <label class="f">Barrote cada <span class="u">${u.sub}</span><input class="in" id="ds-${esc(d.id)}" data-d="${esc(d.id)}" data-k="spacing" value="${esc(d.spacing)}" inputmode="decimal"></label>
          <label class="f">Extra <span class="u">%</span><input class="in" id="dp-${esc(d.id)}" data-d="${esc(d.id)}" data-k="pct" value="${esc(d.pct)}" inputmode="decimal"></label>
        </div>`).join('')}
      </section>

      <section class="card stack">
        <h2>Tu negocio</h2>
        <div class="row">
          <label class="f">Nombre del taller<input class="in" id="o-business" data-o="business" value="${esc(cfg.business)}"></label>
          <label class="f">Tu WhatsApp <span class="u">con código de país</span><input class="in ${cfg.whatsapp && !phoneOk(cfg.whatsapp) ? 'bad' : ''}" id="o-whatsapp" data-o="whatsapp" value="${esc(cfg.whatsapp)}" inputmode="tel" placeholder="Ej. 1 555 123 4567"></label>
          <label class="f">Código de país de tus clientes<input class="in" id="o-cc" data-o="countryCode" value="${esc(cfg.countryCode)}" inputmode="numeric" placeholder="1 = EE. UU., 52 = México"></label>
        </div>
        <div class="row">
          <label class="f">Moneda<select class="in" id="o-currency" data-o="currency"><option value="USD" ${cfg.currency === 'USD' ? 'selected' : ''}>Dólares (USD)</option><option value="MXN" ${cfg.currency === 'MXN' ? 'selected' : ''}>Pesos (MXN)</option></select></label>
          <label class="f">Medidas en<select class="in" id="o-unit" data-o="unit"><option value="ft" ${cfg.unit === 'ft' ? 'selected' : ''}>Pies</option><option value="m" ${cfg.unit === 'm' ? 'selected' : ''}>Metros</option></select></label>
          <label class="f">Rango que ve el cliente <span class="u">± %</span><input class="in" id="o-range" data-o="rangePct" value="${esc(cfg.rangePct)}" inputmode="decimal"></label>
          <label class="f">Redondear a <span class="u">${cfg.currency}</span><input class="in" id="o-round" data-o="roundTo" value="${esc(cfg.roundTo)}" inputmode="numeric"></label>
        </div>
        <label class="f">Aviso de que el precio puede variar<textarea class="in" id="o-disc" data-o="disclaimer">${esc(cfg.disclaimer)}</textarea></label>
      </section>

      <div class="savebar">
        <span class="small ${dirty ? '' : 'muted'}" id="save-state">${dirty ? 'Tienes cambios sin publicar. Tus clientes siguen viendo los precios anteriores.' : 'Tus clientes ven estos precios.'}</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${dirty ? '<button class="btn sm ghost" type="button" data-act="discard">Descartar</button>' : ''}
          <button class="btn primary" type="button" data-act="publish" ${dirty ? '' : 'disabled'}>Guardar y publicar</button>
        </div>
      </div>
    </div>`;
  }

  const metalUsed = (id) => cfg.types.some((t) => t.mode !== 'pieza' && (t.frameMetal === id || t.barMetal === id));

  function checklist() {
    const usedIds = [...new Set(cfg.types.filter((t) => t.active && t.mode !== 'pieza').flatMap((t) => [t.frameMetal, t.barMetal]).filter(Boolean))];
    const checks = [
      { ok: phoneOk(cfg.whatsapp), t: 'Tu número de WhatsApp' },
      { ok: usedIds.length > 0 && usedIds.every((id) => metalPrice(id) > 0), t: 'Precio de los metales que usan tus trabajos' },
      { ok: num(cfg.labor.payPerDay) > 0 && num(cfg.labor.maxPersons) >= 1, t: 'Pago por persona' },
      { ok: cfg.types.some(priced), t: 'Al menos un trabajo listo para el cliente' },
    ];
    return checks.map((c) => `<span><i class="dot" style="background:${c.ok ? 'var(--ok)' : 'var(--warn)'}"></i>${esc(c.t)}${c.ok ? '' : ' <span class="muted">(falta)</span>'}</span>`).join('');
  }

  function metalOptions(sel, allowNone) {
    return (allowNone ? `<option value="" ${!sel ? 'selected' : ''}>Sin barrotes</option>` : '') +
      cfg.metals.map((m) => `<option value="${esc(m.id)}" ${m.id === sel ? 'selected' : ''}>${esc(m.name)}${num(m.price) > 0 ? ` — ${money(num(m.price), 2)}` : ' — sin precio'}</option>`).join('');
  }

  function typeEditor(t) {
    const u = U();
    const id = esc(t.id);
    const refShape = t.mode === 'area'
      ? `<label class="f">Ancho <span class="u">${u.len}</span><input class="in" id="ta-${id}" data-t="${id}" data-k="refA" value="${esc(t.refA)}" inputmode="decimal"></label><span class="op">×</span>
         <label class="f">Alto <span class="u">${u.len}</span><input class="in" id="tb-${id}" data-t="${id}" data-k="refB" value="${esc(t.refB)}" inputmode="decimal"></label>`
      : t.mode === 'lineal'
      ? `<label class="f">Largo <span class="u">${u.len}</span><input class="in" id="ta-${id}" data-t="${id}" data-k="refA" value="${esc(t.refA)}" inputmode="decimal"></label>`
      : `<span class="op">1 pieza</span>`;
    const metalFields = t.mode === 'pieza'
      ? `<label class="f">Material por pieza <span class="u">${cfg.currency}</span><input class="in" id="tmat-${id}" data-t="${id}" data-k="material" value="${esc(t.material)}" inputmode="decimal"></label>`
      : `<label class="f">${t.mode === 'lineal' ? 'Pasamanos y postes' : 'Marco y travesaños'}<select class="in" id="tf-${id}" data-t="${id}" data-k="frameMetal">${metalOptions(t.frameMetal)}</select></label>
         <label class="f">Barrotes<select class="in" id="tbm-${id}" data-t="${id}" data-k="barMetal">${metalOptions(t.barMetal, true)}</select></label>
         ${t.mode === 'area'
           ? `<label class="f">Travesaños horizontales<input class="in" id="tr-${id}" data-t="${id}" data-k="rails" value="${esc(t.rails)}" inputmode="numeric"></label>`
           : `<label class="f">Alto del barandal <span class="u">${u.len}</span><input class="in" id="th-${id}" data-t="${id}" data-k="height" value="${esc(t.height)}" inputmode="decimal"></label>
              <label class="f">Poste cada <span class="u">${u.len}</span><input class="in" id="tp-${id}" data-t="${id}" data-k="postEvery" value="${esc(t.postEvery)}" inputmode="decimal"></label>
              <label class="f">Pasamanos / soleras<input class="in" id="tr-${id}" data-t="${id}" data-k="rails" value="${esc(t.rails)}" inputmode="numeric"></label>`}`;
    return `<div class="otype">
      <div class="row" style="align-items:end">
        <label class="f">Trabajo<input class="in" id="tn-${id}" data-t="${id}" data-k="name" value="${esc(t.name)}"></label>
        <label class="f">Se cobra<select class="in" id="tm-${id}" data-t="${id}" data-k="mode">
          <option value="area" ${t.mode === 'area' ? 'selected' : ''}>Por área (ancho × alto)</option>
          <option value="lineal" ${t.mode === 'lineal' ? 'selected' : ''}>Por largo</option>
          <option value="pieza" ${t.mode === 'pieza' ? 'selected' : ''}>Por pieza</option></select></label>
        <label class="f">Mínimo <span class="u">${cfg.currency}</span><input class="in" id="tmin-${id}" data-t="${id}" data-k="min" value="${esc(t.min)}" inputmode="decimal"></label>
      </div>
      <div><div class="sub-h">Material</div><div class="row" style="align-items:end">${metalFields}</div></div>
      <div><div class="sub-h">Mano de obra · ejemplo</div>
        <div class="formula">${refShape}<span class="op">lo hacen</span>
          <label class="f">Personas<input class="in" id="tpp-${id}" data-t="${id}" data-k="refPersons" value="${esc(t.refPersons)}" inputmode="numeric"></label><span class="op">en</span>
          <label class="f">Días<input class="in" id="tdd-${id}" data-t="${id}" data-k="refDays" value="${esc(t.refDays)}" inputmode="decimal"></label>
        </div>
      </div>
      <div class="rate" id="rate-${id}">${rateText(t)}</div>
      <div style="display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px">
        <button class="btn sm" type="button" data-act="toggle-type" data-v="${id}">${t.active ? 'Ocultar al cliente' : 'Mostrar al cliente'}</button>
        <button class="btn sm ghost" type="button" data-act="del-type" data-v="${id}">Eliminar</button>
      </div>
    </div>`;
  }

  // Prueba del ejemplo, para que el dueño compare con lo que cobra normalmente.
  function rateText(t) {
    const u = U();
    if (!t.active) return '<span class="muted">Oculto para el cliente</span>';
    const d = cfg.designs[0];
    const m = materialCost(t, t.refA, t.refB, d?.spacing);
    const l = laborFor(t, sizeOf(t, t.refA, t.refB));
    const what = t.mode === 'area' ? `${fmt(num(t.refA))} × ${fmt(num(t.refB))} ${u.len}` : t.mode === 'lineal' ? `${fmt(num(t.refA))} ${u.len}` : '1 pieza';
    const missing = [];
    if (m.missing) missing.push(t.mode === 'pieza' ? 'precio del material' : 'precio del metal');
    if (!l.persons) missing.push('ejemplo de mano de obra');
    if (missing.length) return `<span style="color:var(--warn)">Falta ${missing.join(' y ')}: no se muestra al cliente</span>`;
    const feet = m.parts.map((p) => `${fmt(p.len, 1)} ${u.len} ${esc(metal(p.id)?.name || '')}`).join(' + ');
    let total = m.cost + l.cost;
    if (num(t.min) > total) total = num(t.min);
    return `Ejemplo ${what}, diseño ${esc((d?.name || '').toLowerCase())}: ${feet ? `${feet} = ` : ''}material ${money(m.cost)} + mano de obra ${money(l.cost)} (${laborText(l)}) ≈ <b>${money(roundUp(total))}</b>`;
  }

  function refreshOwnerHints() {
    const cl = document.getElementById('checklist');
    if (cl) cl.innerHTML = checklist();
    cfg.types.forEach((t) => { const r = document.getElementById(`rate-${t.id}`); if (r) r.innerHTML = rateText(t); });
    cfg.metals.forEach((m) => document.getElementById(`mp-${m.id}`)?.classList.toggle('bad', !(num(m.price) > 0) && metalUsed(m.id)));
    document.getElementById('o-whatsapp')?.classList.toggle('bad', !!cfg.whatsapp && !phoneOk(cfg.whatsapp));
  }

  function setDirty() {
    dirty = true;
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(cfg)); } catch {}
    refreshOwnerHints();
    const s = document.getElementById('save-state');
    if (s) { s.textContent = 'Tienes cambios sin publicar. Tus clientes siguen viendo los precios anteriores.'; s.classList.remove('muted'); }
    const b = document.querySelector('[data-act="publish"]');
    if (b) b.disabled = false;
  }

  /* ───────── Publicar ───────── */
  const SKELETON = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
  function buildDocument(config) {
    const style = document.getElementById('mw-style').textContent;
    const main = document.getElementById('mw-main').textContent;
    const json = JSON.stringify(config, null, 2).replace(/</g, '\\u003c');
    const S = 'script';
    return SKELETON +
      '<title>Estimador de Herrería</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">\n' +
      '<style id="mw-style">' + style + '</style>\n\n<div id="app" class="wrap"></div>\n\n' +
      '<' + S + ' type="application/json" id="mw-config">' + json + '</' + S + '>\n\n' +
      '<' + S + ' id="mw-main">' + main + '</' + S + '>\n</body></html>';
  }
  async function publish() {
    if (!art) { toast('Para guardar, abre esta página dentro de Claude con permiso de edición.'); return; }
    const btn = document.querySelector('[data-act="publish"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Publicando…'; }
    try {
      await art.publish(buildDocument(cfg));
      try { localStorage.removeItem(DRAFT_KEY); } catch {}
      dirty = false;
      toast('Precios publicados');
    } catch (e) {
      const code = e && e.code;
      toast(code === 'conflict' ? 'La página cambió en otra ventana. Se recargará con la versión más nueva.'
        : code === 'not_granted' || code === 'not_writer' ? 'No tienes permiso para publicar cambios.'
        : 'No se pudo publicar. Intenta de nuevo.');
      if (btn) { btn.disabled = false; btn.textContent = 'Guardar y publicar'; }
    }
  }

  /* ───────── Eventos ───────── */
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act, id = el.dataset.i, v = el.dataset.v;
    const item = client.items.find((x) => x.id === id);
    switch (act) {
      case 'view': view = v; try { history.replaceState(null, '', v === 'dueno' ? '#dueno' : '#cliente'); } catch {} render(); break;
      case 'type': if (item) { item.typeId = v; render(); document.getElementById(`a-${item.id}`)?.focus(); } break;
      case 'design': if (item) { item.designId = v; render(); } break;
      case 'add-item': client.items.push(newItem()); render(); break;
      case 'del-item': client.items = client.items.filter((x) => x.id !== id); render(); break;
      case 'via': client.via = v; render(); break;
      case 'submit': submit(); break;
      case 'new':
        client = { items: [newItem()], name: '', phone: '', via: 'whatsapp', address: '', notes: '', tried: false };
        sent = null; render(); window.scrollTo({ top: 0 }); break;
      case 'sent-wa': setTimeout(() => toast('Cuando envíes el mensaje, toca «Nueva cotización» para el siguiente cliente.'), 600); break;
      case 'copy': {
        const ta = document.getElementById('copy-text');
        const text = ta ? ta.value : '';
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => toast('Texto copiado'), () => { ta?.select(); toast('Selecciona y copia el texto'); });
        else { ta?.select(); toast('Selecciona y copia el texto'); }
        break;
      }
      case 'add-metal': cfg.metals.push({ id: uid(), name: 'Nuevo metal', price: 0 }); setDirty(); render(); break;
      case 'del-metal': if (!metalUsed(v)) { cfg.metals = cfg.metals.filter((m) => m.id !== v); setDirty(); render(); } break;
      case 'add-type': cfg.types.push({ id: uid(), name: 'Nuevo trabajo', mode: 'area', frameMetal: cfg.metals[0]?.id || '', barMetal: '', rails: 1, height: 0, postEvery: 0, material: 0, refA: 4, refB: 4, refPersons: 1, refDays: 1, min: 0, active: true }); setDirty(); render(); break;
      case 'del-type': cfg.types = cfg.types.filter((t) => t.id !== v); client.items.forEach((it) => { if (it.typeId === v) it.typeId = ''; }); setDirty(); render(); break;
      case 'toggle-type': { const t = cfg.types.find((x) => x.id === v); if (t) { t.active = !t.active; setDirty(); render(); } break; }
      case 'discard': cfg = clone(PUBLISHED); dirty = false; try { localStorage.removeItem(DRAFT_KEY); } catch {} render(); break;
      case 'publish': publish(); break;
    }
  });

  const NUMERIC = new Set(['refA', 'refB', 'material', 'min', 'pct', 'spacing', 'rangePct', 'roundTo', 'wastePct', 'price', 'rails', 'height', 'postEvery', 'refPersons', 'refDays', 'payPerDay', 'minPerPerson', 'maxPersons']);
  const val = (k, v) => (NUMERIC.has(k) ? num(v) : v);
  document.addEventListener('input', (ev) => {
    const el = ev.target, ds = el.dataset;
    if (ds.c) { client[ds.c] = el.value; const ce = document.getElementById('c-errors'); if (ce) ce.textContent = ''; if (client.tried) el.classList.toggle('bad', ds.c === 'name' ? !el.value.trim() : ds.c === 'phone' ? !phoneOk(el.value) : false); return; }
    if (ds.i && ds.k) {
      const it = client.items.find((x) => x.id === ds.i);
      if (!it) return;
      it[ds.k] = el.value;
      const t = cfg.types.find((x) => x.id === it.typeId);
      const sk = document.getElementById(`sk-${it.id}`);
      if (sk && t) sk.innerHTML = sketch(it, t);
      refreshEstimate();
      return;
    }
    if (ds.o) { cfg[ds.o] = val(ds.o, el.value); setDirty(); if (ds.o === 'currency' || ds.o === 'unit') render(); if (ds.o === 'business') document.querySelector('h1').textContent = el.value || 'Herrería'; return; }
    if (ds.l) { cfg.labor[ds.l] = num(el.value); setDirty(); return; }
    if (ds.m) {
      const m = cfg.metals.find((x) => x.id === ds.m);
      if (!m) return;
      m[ds.k] = val(ds.k, el.value);
      setDirty();
      // los selectores de metal muestran el precio: se actualizan sin perder el foco
      document.querySelectorAll('select[data-k="frameMetal"], select[data-k="barMetal"]').forEach((s) => { const t = cfg.types.find((x) => x.id === s.dataset.t); if (t) s.innerHTML = metalOptions(t[s.dataset.k], s.dataset.k === 'barMetal'); });
      return;
    }
    if (ds.t) {
      const t = cfg.types.find((x) => x.id === ds.t);
      if (!t) return;
      t[ds.k] = val(ds.k, el.value);
      if (ds.k === 'mode') {
        if (t.mode === 'area' && !num(t.refB)) t.refB = 1;
        if (t.mode === 'lineal') { if (!num(t.height)) t.height = 3; if (!num(t.postEvery)) t.postEvery = 6; if (!num(t.rails)) t.rails = 2; }
        setDirty(); render(); return;
      }
      setDirty();
      return;
    }
    if (ds.d) {
      const d = cfg.designs.find((x) => x.id === ds.d);
      if (!d) return;
      d[ds.k] = val(ds.k, el.value);
      setDirty();
    }
  });
  document.addEventListener('change', (ev) => { if (ev.target.tagName === 'SELECT' && (ev.target.dataset.o || ev.target.dataset.t)) ev.target.dispatchEvent(new Event('input', { bubbles: true })); });

  /* ───────── Arranque ───────── */
  if (location.hash === '#dueno') view = 'dueno';
  render();

  (async () => {
    const host = window.claude;
    if (!host || !host.use) return;
    const [user, artifact] = await Promise.all([host.use('user').catch(() => null), host.use('artifact').catch(() => null)]);
    art = artifact;
    canEdit = user ? !!(await user.canEdit().catch(() => false)) : false;
    if (!canEdit) { if (view === 'dueno') { view = 'cliente'; render(); } return; }
    try {
      const d = localStorage.getItem(DRAFT_KEY);
      if (d) { const parsed = JSON.parse(d); if (parsed && Array.isArray(parsed.types) && Array.isArray(parsed.metals) && JSON.stringify(parsed) !== JSON.stringify(PUBLISHED)) { cfg = parsed; dirty = true; } }
    } catch {}
    if (!cfg.types.some(priced) || !phoneOk(cfg.whatsapp) || dirty || location.hash === '#dueno') view = 'dueno';
    render();
  })();
})();
</script>
