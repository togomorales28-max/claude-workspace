name: Jarvis APK

on:
  workflow_dispatch:
  push:
    paths:
      - "jarvis/android-app/**"
      - ".github/workflows/jarvis-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Capacitor y crear el proyecto Android
        run: |
          npm install
          npx cap add android

      - name: Permisos de micrófono e icono de Jarvis
        run: |
          python3 - <<'PY'
          import re, pathlib
          m = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = m.read_text()
          extra = ('    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
                   '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n')
          if "RECORD_AUDIO" not in s:
              s = s.replace("</manifest>", extra + "</manifest>")
          m.write_text(s)
          PY
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import pathlib
          src = Image.open("www/icon.png").convert("RGBA")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          res = pathlib.Path("android/app/src/main/res")
          for d, n in sizes.items():
              folder = res / f"mipmap-{d}"
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  src.resize((n, n), Image.LANCZOS).save(folder / name)
              fg = Image.new("RGBA", (int(n * 2.25),) * 2, (3, 6, 13, 255))
              inner = src.resize((int(n * 1.5),) * 2, Image.LANCZOS)
              off = (fg.width - inner.width) // 2
              fg.paste(inner, (off, off))
              fg.save(folder / "ic_launcher_foreground.png")
          bg = res / "values" / "ic_launcher_background.xml"
          if bg.exists():
              bg.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#03060D</color>\n</resources>\n')
          PY
          npx cap sync android

      - name: Compilar APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: jarvis/android-app/android/app/build/outputs/apk/debug/app-debug.apk
