name: Jarvis APK

on:
  workflow_dispatch:
  push:
    paths:
      - "jarvis/android-app/**"
      - ".github/workflows/jarvis-apk.yml"

env:
  LLAMA_CPP_TAG: v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dependencias de Capacitor
        run: npm ci

      - name: Descargar llama.cpp (versión fija)
        run: git clone --depth 1 --branch "$LLAMA_CPP_TAG" https://github.com/ggml-org/llama.cpp android/app/src/main/cpp/llama.cpp

      # La firma se crea una vez y se reutiliza, para poder actualizar la app sin desinstalarla.
      - name: Recuperar la firma de la app
        uses: actions/cache@v4
        with:
          path: jarvis/android-app/jarvis.keystore
          key: jarvis-keystore-v1
      - name: Crear la firma si no existe
        run: |
          if [ ! -f jarvis.keystore ]; then
            keytool -genkeypair -v -keystore jarvis.keystore -alias jarvis -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass jarvis-android -keypass jarvis-android -dname "CN=Jarvis"
          fi
          echo "JARVIS_KEYSTORE=$PWD/jarvis.keystore" >> "$GITHUB_ENV"
          echo "JARVIS_KEYSTORE_PASS=jarvis-android" >> "$GITHUB_ENV"

      - name: Comprobar que los modelos se pueden descargar
        run: |
          for m in Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf \
                   Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf \
                   Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-0 "https://huggingface.co/Qwen/$m")
            echo "$code $m"
            case "$code" in 200|206) ;; *) echo "::warning::Modelo no accesible: $m ($code)";; esac
          done

      - name: Probar la búsqueda en internet (informativo)
        continue-on-error: true
        run: |
          curl -sL -o /tmp/json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          mkdir -p /tmp/ws && javac -nowarn -cp /tmp/json.jar -d /tmp/ws android/app/src/main/java/com/jarvis/asistente/WebSearch.java
          java -cp /tmp/ws:/tmp/json.jar com.jarvis.asistente.WebSearch "como quedo el partido de los 49ers y vikings"
          java -cp /tmp/ws:/tmp/json.jar com.jarvis.asistente.WebSearch "noticias de hoy en Mexico"

      - name: Copiar la interfaz al proyecto Android
        run: npx cap sync android

      - name: Compilar APK
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: jarvis/android-app/android/app/build/outputs/apk/release/app-release.apk
