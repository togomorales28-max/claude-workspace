name: Metalwork Calculator — pruebas

on:
  push:
    paths: ['metalwork/**', '.github/workflows/metalwork-ci.yml']
  pull_request:
    paths: ['metalwork/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metalwork
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: metalwork/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
