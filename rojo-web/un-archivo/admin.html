<title>Rojo Iron Works · Cotizaciones</title>
<style>
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f6f8fb; --ink: #121821; --ink-2: #3c4757; --mute: #677385;
  --line: #d9e0e8; --accent: #9e1b1b; --accent-2: #7f1414; --accent-soft: #f7e3e1; --on-accent: #ffffff;
  --ok: #1a8a60; --ok-soft: #e1f4ec; --warn: #a3650f; --warn-soft: #fbf0dc; --bad: #c23a30; --bad-soft: #fbe6e4;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --mono: ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0b0f14; --surface: #121922; --surface-2: #17202b; --ink: #e6edf5; --ink-2: #b4c0ce; --mute: #8592a4;
  --line: #263345; --accent: #f0645a; --accent-2: #ff8a80; --accent-soft: #3a1714; --on-accent: #1a0503;
  --ok: #3cc08d; --ok-soft: #10301f; --warn: #f0b341; --warn-soft: #33270f; --bad: #f2645a; --bad-soft: #3a1714; color-scheme: dark;
} }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right)) 64px max(16px, env(safe-area-inset-left)); }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; } h1 { font-size: 24px; } h2 { font-size: 17px; }
p { margin: 0; }
.muted { color: var(--mute); } .small { font-size: 13px; } .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.tabs { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tabs button { border: 0; background: none; color: var(--mute); font: inherit; font-weight: 500; font-size: 14px; padding: 7px 14px; border-radius: 7px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 12px; text-align: center; margin-left: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.stack { display: grid; gap: 16px; }
.row { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
label.f { display: grid; gap: 5px; font-size: 13px; font-weight: 500; color: var(--ink-2); min-width: 0; }
label.f .u { font-family: var(--mono); font-size: 11px; color: var(--mute); font-weight: 400; }
.in { width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; padding: 0 11px; }
textarea.in { height: auto; min-height: 70px; padding: 9px 11px; resize: vertical; }
.in:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.in.bad { border-color: var(--bad); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 42px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; font-size: 14.5px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.wa { background: #1fa855; border-color: #1fa855; color: #fff; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13.5px; font-weight: 500; }
.btn.ghost { border-color: transparent; background: none; color: var(--mute); }
.btn:disabled { opacity: .45; pointer-events: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { border-radius: 9px; padding: 10px 12px; font-size: 13.5px; background: var(--warn-soft); color: var(--warn); }
.notice.info { background: var(--accent-soft); color: var(--ink-2); }
.login { max-width: 420px; margin: 8vh auto 0; }
/* cotizaciones */
.quote { display: grid; gap: 10px; }
.quote-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; }
.quote .total { font-family: var(--mono); font-size: 22px; font-weight: 600; }
.pill { display: inline-block; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); }
.pill.nueva { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.contactado { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.vendida { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.quote ul { margin: 0; padding-left: 18px; font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
details pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); padding: 10px; border-radius: 8px; margin: 8px 0 0; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* precios */
.otype { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface-2); display: grid; gap: 12px; }
.formula { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; }
.formula .op { font-family: var(--mono); color: var(--mute); padding-bottom: 10px; }
.formula label.f { width: 100px; }
.rate { font-family: var(--mono); font-size: 12.5px; color: var(--ok); } .rate b { color: var(--ink); }
.sub-h { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
.metal-row { display: grid; grid-template-columns: minmax(0, 1fr) 130px 80px; gap: 8px; align-items: center; }
.savebar { position: sticky; bottom: 0; margin-top: 18px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; box-shadow: 0 -6px 18px rgba(0,0,0,.08); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 9px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
[hidden] { display: none !important; }
.day { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin: 18px 0 6px; }
.qlist { display: grid; gap: 8px; }
.qrow { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.qrow > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; }
.qrow > summary::-webkit-details-marker { display: none; }
.qrow[open] > summary { border-bottom: 1px solid var(--line); }
.qrow .when { font-family: var(--mono); font-size: 13px; color: var(--ink-2); line-height: 1.25; }
.qrow .when small { display: block; color: var(--mute); font-size: 11px; }
.qrow .who { min-width: 0; } .qrow .who b { display: block; } .qrow .who span { display: block; font-size: 13px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qrow .amt { text-align: right; font-family: var(--mono); font-weight: 600; } .qrow .amt .pill { margin-top: 4px; }
.qrow .body { padding: 14px; display: grid; gap: 10px; }
.qrow.is-new { border-color: var(--bad); }
.pushcard { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.pw { position: relative; } .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--mute); font: inherit; font-size: 13px; cursor: pointer; padding: 6px; }
</style>

<script>
(function () {
  'use strict';
  var C = window.Cotizador, core = C.core;
  var store = C.createStore(window.COTIZADOR_CONFIG);
  var DRAFT_KEY = 'cotizador-admin-borrador';
  var $app = document.getElementById('app');
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var num = core.num, fmt = core.fmt;
  var uid = function () { return Math.random().toString(36).slice(2, 9); };
  var NUMERIC = ['refA', 'refB', 'material', 'min', 'pct', 'spacing', 'rangePct', 'roundTo', 'wastePct', 'price', 'rails', 'height', 'postEvery', 'refPersons', 'refDays'];
  var val = function (k, v) { return NUMERIC.indexOf(k) >= 0 ? num(v) : v; };

  var CONF = window.COTIZADOR_CONFIG || {};
  var S = { session: null, view: 'cotizaciones', published: null, cfg: null, dirty: false, quotes: [], filter: 'todas',
    authMode: 'login', authMsg: '', authErr: '', busy: false, push: 'desconocido' };
  var ADMIN_URL = location.origin + location.pathname;
  var money = function (n, d) { return core.money(S.cfg, n, d); };
  var U = function () { return core.U(S.cfg); };

  var toastTimer;
  function toast(t) {
    var el = document.querySelector('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 3200);
  }

  /* ───────── Entrada con correo y contraseña (la sesión queda guardada) ───────── */
  function authErrText(e) {
    var m = String((e && e.message) || '');
    if (/invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
    if (/email not confirmed/i.test(m)) return 'Tu correo aún no está confirmado. Abre el correo de confirmación que te llegó.';
    if (/already registered|already been registered/i.test(m)) return 'Ese correo ya tiene cuenta. Entra con tu contraseña.';
    if (/password should be at least|weak/i.test(m)) return 'La contraseña debe tener al menos 8 caracteres.';
    if (/rate limit|too many/i.test(m)) return 'Demasiados intentos. Espera unos minutos.';
    return m || 'No se pudo completar. Revisa tu conexión.';
  }
  function pwField(name, label, auto) {
    return '<label class="f">' + label + '<span class="pw"><input class="in" type="password" name="' + name + '" autocomplete="' + auto + '" minlength="8" required style="padding-right:64px"><button type="button" data-act="toggle-pw">Ver</button></span></label>';
  }
  function loginView() {
    var m = S.authMode, err = S.authErr ? '<p class="small" style="color:var(--bad)" role="alert">' + esc(S.authErr) + '</p>' : '';
    var msg = S.authMsg ? '<p class="notice info">' + esc(S.authMsg) + '</p>' : '';
    var head = '<div><div class="eyebrow">Rojo Iron Works · Panel del dueño</div><h1>' +
      (m === 'signup' ? 'Crear mi cuenta' : m === 'forgot' ? 'Recuperar contraseña' : m === 'recovery' ? 'Nueva contraseña' : 'Entrar') + '</h1></div>';
    var body;
    if (m === 'recovery') {
      body = '<form class="stack" data-form="recovery">' + pwField('password', 'Nueva contraseña', 'new-password') + err +
        '<button class="btn primary" type="submit"' + (S.busy ? ' disabled' : '') + '>Guardar contraseña</button></form>';
    } else if (m === 'forgot') {
      body = '<form class="stack" data-form="forgot"><label class="f">Correo<input class="in" type="email" name="email" autocomplete="email" required></label>' + err +
        '<button class="btn primary" type="submit"' + (S.busy ? ' disabled' : '') + '>Enviarme el enlace</button></form>' +
        '<button class="btn ghost" data-act="auth-mode" data-v="login">Volver</button>';
    } else if (m === 'signup') {
      body = '<p class="small muted">Solo la primera vez. La primera cuenta que se crea queda como dueña del panel.</p>' +
        '<form class="stack" data-form="signup"><label class="f">Correo<input class="in" type="email" name="email" autocomplete="email" required></label>' +
        pwField('password', 'Contraseña (mínimo 8 caracteres)', 'new-password') + err +
        '<button class="btn primary" type="submit"' + (S.busy ? ' disabled' : '') + '>Crear cuenta y entrar</button></form>' +
        '<button class="btn ghost" data-act="auth-mode" data-v="login">Ya tengo cuenta</button>';
    } else {
      body = '<p class="small muted">Entras una sola vez: este dispositivo recordará tu sesión.</p>' +
        '<form class="stack" data-form="login"><label class="f">Correo<input class="in" type="email" name="email" autocomplete="username" required></label>' +
        pwField('password', 'Contraseña', 'current-password') + err +
        '<button class="btn primary" type="submit"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Entrando…' : 'Entrar') + '</button></form>' +
        '<div class="actions" style="justify-content:space-between"><button class="btn ghost sm" data-act="auth-mode" data-v="forgot">¿Olvidaste tu contraseña?</button>' +
        '<button class="btn ghost sm" data-act="auth-mode" data-v="signup">Primera vez: crear cuenta</button></div>';
    }
    return '<div class="login card stack">' + head + msg + body + '</div>';
  }

  /* ───────── Pantalla principal ───────── */
  function render() {
    if (!S.session || S.authMode === 'recovery') { $app.innerHTML = loginView(); return; }
    if (!S.cfg) { $app.innerHTML = '<p class="muted">Cargando…</p>'; return; }
    var nuevas = S.quotes.filter(function (q) { return q.status === 'nueva'; }).length;
    $app.innerHTML =
      (store.demo ? '<p class="notice" style="margin-bottom:12px"><b>Modo de prueba.</b> Falta poner los datos de Supabase en config.js; todo se guarda solo en este navegador.</p>' : '') +
      '<header class="top"><div><div class="eyebrow">Panel del dueño · ' + esc(S.session.user && S.session.user.email) + '</div><h1>' + esc(S.cfg.business || 'Mi herrería') + '</h1></div>' +
      '<div class="actions"><div class="tabs" role="tablist">' +
      '<button role="tab" data-act="view" data-v="cotizaciones" aria-selected="' + (S.view === 'cotizaciones') + '">Cotizaciones' + (nuevas ? '<span class="badge">' + nuevas + '</span>' : '') + '</button>' +
      '<button role="tab" data-act="view" data-v="precios" aria-selected="' + (S.view === 'precios') + '">Precios</button></div>' +
      (window.COTIZADOR_CONFIG && window.COTIZADOR_CONFIG.siteUrl ? '<a class="btn sm" href="' + esc(window.COTIZADOR_CONFIG.siteUrl) + '" target="_blank" rel="noopener">Ver mi web</a>' : '') +
      (store.demo ? '' : '<button class="btn sm ghost" data-act="logout">Salir</button>') + '</div></header>' +
      '<main>' + (S.view === 'precios' ? pricesView() : quotesView()) + '</main>';
  }

  /* ───────── Cotizaciones ───────── */
  var STATUS = [['nueva', 'Nueva'], ['contactado', 'Contactado'], ['vendida', 'Vendida'], ['descartada', 'Descartada']];
  function pushCard() {
    var st = S.push;
    var txt = st === 'activo' ? '<b>Avisos activados</b> en este dispositivo. Te llegará una notificación con cada cotización, aunque la app esté cerrada.'
      : st === 'bloqueado' ? '<b>Avisos bloqueados.</b> Permite las notificaciones para este sitio en los ajustes del navegador o del teléfono.'
      : st === 'ios-instalar' ? '<b>En iPhone:</b> toca Compartir → «Agregar a pantalla de inicio», abre la app desde el ícono y activa los avisos ahí.'
      : st === 'no-soportado' ? 'Este navegador no permite avisos. Usa Chrome en Android o computadora, o Safari en iPhone (instalando la app).'
      : '<b>Recibe un aviso</b> en este teléfono o computadora cada vez que alguien cotice.';
    var btn = st === 'activo' ? '<button class="btn sm" data-act="push-test">Probar aviso</button><button class="btn sm ghost" data-act="push-off">Desactivar</button>'
      : (st === 'inactivo' || st === 'desconocido') ? '<button class="btn sm primary" data-act="push-on">Activar avisos</button>' : '';
    return '<section class="card pushcard"><p class="small" style="max-width:640px">🔔 ' + txt + '</p><div class="actions">' + btn + '</div></section>';
  }
  function dayLabel(d) {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var x = new Date(d); x.setHours(0, 0, 0, 0);
    var diff = Math.round((today - x) / 86400000);
    if (diff === 0) return 'Hoy';
    if (diff === 1) return 'Ayer';
    return new Date(d).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: x.getFullYear() === today.getFullYear() ? undefined : 'numeric' });
  }
  function quotesView() {
    var list = S.quotes.filter(function (q) { return S.filter === 'todas' || q.status === S.filter; });
    var cfg = S.cfg, lastDay = '';
    var rows = list.map(function (q) {
      var d = new Date(q.created_at), label = dayLabel(q.created_at), head = '';
      if (label !== lastDay) { head = '<div class="day">' + esc(label) + '</div>'; lastDay = label; }
      var first = String(q.client_name || '').split(' ')[0];
      var hello = 'Hola ' + first + ', soy de ' + (cfg.business || 'la herrería') + '. Recibimos tu cotización ' + q.folio + ' por ' + core.money(cfg, q.total) + '. ¿Cuándo podemos ir a tomar medidas?';
      var job = (q.detail || []).map(function (x) { return String(x.text || '').split(' — ').slice(0, 2).join(' '); }).join(' · ');
      var phone = String(q.client_phone || '');
      var label2 = (STATUS.find(function (s) { return s[0] === q.status; }) || [0, q.status])[1];
      return head + '<details class="qrow' + (q.status === 'nueva' ? ' is-new' : '') + '"><summary>' +
        '<div class="when">' + d.toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' }) + '<small>' + d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' }) + '</small></div>' +
        '<div class="who"><b>' + esc(q.client_name) + '</b><span>' + esc(job || q.folio) + '</span></div>' +
        '<div class="amt">' + core.money(cfg, q.total) + '<br><span class="pill ' + esc(q.status) + '">' + esc(label2) + '</span></div></summary>' +

      var m = cfg.metals.find(function (x) { return x.id === ds.m; }); if (!m) return;
      m[ds.k] = val(ds.k, el.value);
      if (ds.k === 'price' && cfg.examplePrices) { cfg.examplePrices = false; var bn = document.getElementById('example-banner'); if (bn) bn.remove(); }
      setDirty();
      document.querySelectorAll('select[data-k="frameMetal"], select[data-k="barMetal"]').forEach(function (s) { var t = cfg.types.find(function (x) { return x.id === s.dataset.t; }); if (t) s.innerHTML = metalOptions(t[s.dataset.k], s.dataset.k === 'barMetal'); });
      return;
    }
    if (ds.t) {
      var t = cfg.types.find(function (x) { return x.id === ds.t; }); if (!t) return;
      t[ds.k] = val(ds.k, el.value);
      if (ds.k === 'mode') {
        if (t.mode === 'area' && !num(t.refB)) t.refB = 1;
        if (t.mode === 'lineal') { if (!num(t.height)) t.height = 3; if (!num(t.postEvery)) t.postEvery = 6; if (!num(t.rails)) t.rails = 2; }
        setDirty(); render(); return;
      }
      setDirty(); return;
    }
    if (ds.d) { var d = cfg.designs.find(function (x) { return x.id === ds.d; }); if (d) { d[ds.k] = val(ds.k, el.value); setDirty(); } return; }
    if (ds.f) { var f = (cfg.features || []).find(function (x) { return x.id === ds.f; }); if (f) { f[ds.k] = val(ds.k, el.value); setDirty(); } }
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.dataset.status) { store.updateQuote(Number(el.dataset.status) || el.dataset.status, { status: el.value }).then(loadQuotes).catch(function () { toast('No se pudo cambiar el estado.'); }); return; }
    if (el.tagName === 'SELECT' && (el.dataset.o || el.dataset.t)) el.dispatchEvent(new Event('input', { bubbles: true }));
  });

  /* ───────── Datos ───────── */
  var knownIds = null;
  function loadQuotes() {
    return store.listQuotes().then(function (list) {
      var fresh = knownIds ? list.filter(function (q) { return knownIds.indexOf(q.id) < 0; }) : [];
      knownIds = list.map(function (q) { return q.id; });
      S.quotes = list;
      if (fresh.length) {
        toast(fresh.length === 1 ? 'Nueva cotización de ' + fresh[0].client_name : fresh.length + ' cotizaciones nuevas');
        beep();
        // si este dispositivo no tiene avisos push, se avisa desde la página abierta
        if (S.push !== 'activo' && document.hidden) notifyLocal('Nueva cotización · ' + core.money(S.cfg, fresh[0].total), fresh[0].client_name, 'cotizacion-' + fresh[0].id);
      }
      var nNew = list.filter(function (q) { return q.status === 'nueva'; }).length;
      document.title = (nNew ? '(' + nNew + ') ' : '') + 'Rojo Iron Works · Cotizaciones';
      if (S.view === 'cotizaciones' || fresh.length) {
        var keepScroll = window.scrollY;
        if (S.view === 'cotizaciones') { render(); window.scrollTo(0, keepScroll); }
        else { var tab = document.querySelector('[data-v="cotizaciones"]'); if (tab) tab.innerHTML = 'Cotizaciones<span class="badge">' + S.quotes.filter(function (q) { return q.status === 'nueva'; }).length + '</span>'; }
      }
    }).catch(function () { toast('No se pudieron cargar las cotizaciones.'); });
  }
  var started = false;
  function startOwner() {
    if (started) return; started = true;
    store.isOwner().then(function (ok) {
      if (!ok) {
        $app.innerHTML = '<div class="login card stack"><h1>Sin permiso</h1><p class="muted">El correo <b>' + esc(S.session.user.email) + '</b> no es el dueño de este panel. Entra con el correo con el que creaste la cuenta.</p><button class="btn" data-act="logout">Salir</button></div>';
        started = false; return;
      }
      return store.loadConfig().then(function (cfg) {
        S.published = cfg || JSON.parse(JSON.stringify(C.DEFAULT_CONFIG));
        S.cfg = JSON.parse(JSON.stringify(S.published));
        try {
          var d = localStorage.getItem(DRAFT_KEY);
          if (d) { var p = JSON.parse(d); if (p && Array.isArray(p.types) && JSON.stringify(p) !== JSON.stringify(S.published)) { S.cfg = p; S.dirty = true; S.view = 'precios'; } }
        } catch (e) { /* sin borrador */ }
        checkPush().then(render);
        render();
        store.onConfig(function (c) { S.published = c; if (!S.dirty) { S.cfg = JSON.parse(JSON.stringify(c)); if (S.view === 'precios') render(); } });
        loadQuotes();
        store.onQuotes(loadQuotes);
        setInterval(loadQuotes, 60000); // respaldo por si se pierde la conexión en tiempo real
      });
    }).catch(function () { $app.innerHTML = '<div class="login card"><p class="notice">No se pudo conectar con Supabase. Revisa config.js y tu conexión.</p></div>'; started = false; });
  }
  /* ───────── Avisos (notificaciones push) ───────── */
  var SW_URL = 'cotizador-sw.js';
  function b64ToBytes(b64) {
    var pad = '='.repeat((4 - (b64.length % 4)) % 4), raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    var out = new Uint8Array(raw.length); for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i); return out;
  }
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  function pushSupported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
  function checkPush() {
    if (!pushSupported()) { S.push = isIOS && !standalone ? 'ios-instalar' : 'no-soportado'; return Promise.resolve(); }
    if (Notification.permission === 'denied') { S.push = 'bloqueado'; return Promise.resolve(); }
    return navigator.serviceWorker.getRegistration(SW_URL).then(function (reg) { return reg && reg.pushManager.getSubscription(); })
      .then(function (sub) { S.push = sub && Notification.permission === 'granted' ? 'activo' : 'inactivo'; })
      .catch(function () { S.push = 'inactivo'; });
  }
  function pushOn() {
    if (!pushSupported()) { checkPush().then(render); return; }
    if (!CONF.vapidPublicKey) { toast('Falta la llave de avisos en config.js.'); return; }
    Notification.requestPermission().then(function (perm) {
      if (perm !== 'granted') { S.push = perm === 'denied' ? 'bloqueado' : 'inactivo'; render(); return; }
      return fetch(SW_URL, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('sin-sw');
      }).then(function () { return navigator.serviceWorker.register(SW_URL); }).then(function () { return navigator.serviceWorker.ready; }).then(function (reg) {
        return reg.pushManager.getSubscription().then(function (sub) {
          return sub || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(CONF.vapidPublicKey) });
        });
      }).then(function (sub) {
        var j = sub.toJSON();
        return store.savePushSub({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, device: (isIOS ? 'iPhone' : /android/i.test(navigator.userAgent) ? 'Android' : 'Computadora') + ' · ' + new Date().toLocaleDateString('es-MX') }, S.session.user.email);
      }).then(function () { S.push = 'activo'; render(); toast('Avisos activados en este dispositivo'); });
    }).catch(function (e) {
      toast(e && e.message === 'sin-sw' ? 'Para recibir avisos, sube también el archivo cotizador-sw.js junto a admin.html.' : 'No se pudieron activar los avisos. Intenta de nuevo.');
    });
  }
  function pushOff(silent) {
    if (!pushSupported()) return Promise.resolve();
    return navigator.serviceWorker.getRegistration(SW_URL).then(function (reg) { return reg && reg.pushManager.getSubscription(); })
      .then(function (sub) { if (!sub) return; return store.deletePushSub(sub.endpoint).catch(function () {}).then(function () { return sub.unsubscribe(); }); })
      .then(function () { if (!silent) { S.push = 'inactivo'; render(); toast('Avisos desactivados'); } })
      .catch(function () {});
  }
  function notifyLocal(title, body, tag) {
    if (!('Notification' in window) || Notification.permission !== 'granted') { toast(title + ' — ' + body); return; }
    var opts = { body: body, tag: tag, icon: 'cotizador-icon-192.png', badge: 'cotizador-icon-192.png' };
    navigator.serviceWorker && navigator.serviceWorker.getRegistration(SW_URL).then(function (reg) {
      if (reg) reg.showNotification(title, opts); else new Notification(title, opts);
    }).catch(function () { try { new Notification(title, opts); } catch (e) { toast(title); } });
  }
  var audioCtx = null;
  function beep() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.18].forEach(function (t) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; g.gain.setValueAtTime(0.0001, audioCtx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.15);
        o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.16);
      });
    } catch (e) { /* sin sonido */ }
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function (ev) { if (ev.data === 'cotizaciones') { S.view = 'cotizaciones'; loadQuotes(); } });

  store.onAuth(function (session, event) {
    S.session = session;
    if (event === 'PASSWORD_RECOVERY') { S.authMode = 'recovery'; render(); return; }
    if (session && S.authMode !== 'recovery') { S.authMode = 'login'; startOwner(); } else if (!session) { started = false; S.cfg = null; render(); }
  });
  store.session().then(function (session) { S.session = session; if (session && S.authMode !== 'recovery') startOwner(); else render(); });
})();
</script>
</body>
</html>
